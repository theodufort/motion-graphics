<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=20000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr,flatNodes,nodes,edges;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp01=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const fade=(t,a,b)=>{const d=b-a;if(t<a||t>=b)return 0;if(t<a+d*.2)return ease(t/(a+d*.2));if(t>b-d*.2)return ease((b-t)/(d*.2));return 1};
function buildLayout(){
flatNodes=Array.from({length:12},(_,i)=>({x:W*(.15+.7*i/11),y:H*.55,r:W*.012}));
const lv=[1,3,8];nodes=[];
lv.forEach((c,li)=>{for(let i=0;i<c;i++)nodes.push({x:W*(.5+(i-(c-1)/2)*.22),y:H*(.22+li*.22),r:W*(.014-li*.002),level:li,idx:i})});
edges=[];for(let i=1;i<=3;i++)edges.push([0,i]);
for(let i=1;i<=3;i++)for(let j=0;j<3;j++){const l=4+i*3+j;if(l<12)edges.push([i,l])}
}
let __seek=null;
window.__time=(v)=>{__seek=v};
window.__loop=LOOP;
function drawBg(){
ctx.strokeStyle=rgba(PAL.text,.03);ctx.lineWidth=1;
const s=W/20;
for(let x=0;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=0;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function drawBeat1(t,b){
const a=fade(b,0,.25);if(a<=0)return;
ctx.font=`bold ${W*.028}px system-ui`;ctx.fillStyle=rgba(PAL.text,a);ctx.textAlign='center';
ctx.fillText('Linear Scan',W*.5,H*.12);
flatNodes.forEach((n,i)=>{
const p=1+.15*Math.sin(t/400+i*.5);
ctx.beginPath();ctx.arc(n.x,n.y,n.r*p,0,Math.PI*2);
ctx.fillStyle=rgba(PAL.muted,a*.6);ctx.fill();ctx.strokeStyle=rgba(PAL.muted,a*.3);ctx.stroke()});
const st=clamp01(b/.25*1.1),px=lerp(flatNodes[0].x,flatNodes[11].x,ease(st)),py=flatNodes[0].y;
ctx.beginPath();ctx.arc(px,py,W*.008,0,Math.PI*2);
ctx.fillStyle=rgba(PAL.fail,a);ctx.shadowColor=rgba(PAL.fail,a*.5);ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
ctx.font=`${W*.018}px system-ui`;ctx.fillStyle=rgba(PAL.fail,a);
ctx.fillText(`${Math.floor(ease(st)*12)} / 12 checked`,W*.5,H*.75);
}
function drawBeat2(t,b){
const a=fade(b,.25,.5);if(a<=0)return;
ctx.font=`bold ${W*.028}px system-ui`;ctx.fillStyle=rgba(PAL.text,a);ctx.textAlign='center';
ctx.fillText('B-Tree Index',W*.5,H*.12);
edges.forEach(([f,i])=>{const n1=nodes[f],n2=nodes[i];
ctx.beginPath();ctx.moveTo(n1.x,n1.y);ctx.lineTo(n2.x,n2.y);
ctx.strokeStyle=rgba(PAL.accent,a*.25);ctx.lineWidth=1.5;ctx.stroke()});
nodes.forEach((n,i)=>{
const p=1+.12*Math.sin(t/400+i*.7);
ctx.beginPath();ctx.arc(n.x,n.y,n.r*p,0,Math.PI*2);
ctx.fillStyle=rgba(PAL.accent,a*.5);ctx.fill();ctx.strokeStyle=rgba(PAL.accent,a*.4);ctx.stroke()});
ctx.font=`${W*.012}px system-ui`;ctx.fillStyle=rgba(PAL.muted,a*.7);
ctx.fillText('root',nodes[0].x,nodes[0].y-nodes[0].r-W*.01);
ctx.fillText('mid',nodes[1].x,nodes[1].y-nodes[1].r-W*.01);
ctx.fillText('leaf',nodes[4].x,nodes[4].y+nodes[4].r+W*.018);
}
function drawBeat3(t,b){
const a=fade(b,.5,.75);if(a<=0)return;
ctx.font=`bold ${W*.028}px system-ui`;ctx.fillStyle=rgba(PAL.text,a);ctx.textAlign='center';
ctx.fillText('Indexed Lookup',W*.5,H*.12);
edges.forEach(([f,i])=>{const n1=nodes[f],n2=nodes[i];
ctx.beginPath();ctx.moveTo(n1.x,n1.y);ctx.lineTo(n2.x,n2.y);
ctx.strokeStyle=rgba(PAL.accent,a*.15);ctx.lineWidth=1;ctx.stroke()});
nodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=rgba(PAL.accent,a*.3);ctx.fill()});
const path=[nodes[0],nodes[1],nodes[4]];
const ht=clamp01((b-.5)/.25*3),hop=Math.min(Math.floor(ht),2),hf=ease(ht-hop);
let px,py;
if(hop<2){px=lerp(path[hop].x,path[hop+1].x,hf);py=lerp(path[hop].y,path[hop+1].y,hf)}
else{px=path[2].x;py=path[2].y}
for(let i=0;i<=hop;i++){
ctx.beginPath();ctx.moveTo(path[i].x,path[i].y);ctx.lineTo(path[Math.min(i+1,2)].x,path[Math.min(i+1,2)].y);
ctx.strokeStyle=rgba(PAL.accent,a*.8);ctx.lineWidth=3;ctx.stroke()}
ctx.beginPath();ctx.arc(px,py,W*.009,0,Math.PI*2);
ctx.fillStyle=rgba(PAL.accent,a);ctx.shadowColor=rgba(PAL.accent,a*.6);ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
ctx.font=`${W*.018}px system-ui`;ctx.fillStyle=rgba(PAL.accent,a);
ctx.fillText(`${Math.min(hop+1,3)} / 3 hops`,W*.5,H*.82);
}
function drawBeat4(t,b){
const a=fade(b,.75,1);if(a<=0)return;
ctx.font=`bold ${W*.028}px system-ui`;ctx.fillStyle=rgba(PAL.text,a);ctx.textAlign='center';
ctx.fillText('12 vs 3 Hops',W*.5,H*.12);
const lx=W*.3,rx=W*.7;
ctx.font=`${W*.014}px system-ui`;
ctx.fillStyle=rgba(PAL.fail,a*.8);ctx.fillText('Linear',lx,H*.3);
ctx.fillStyle=rgba(PAL.accent,a*.8);ctx.fillText('B-Tree',rx,H*.3);
const ct=clamp01((b-.75)/.25),cl=Math.floor(ease(ct)*12),cr=Math.floor(ease(ct)*3);
ctx.font=`bold ${W*.05}px system-ui`;
ctx.fillStyle=rgba(PAL.fail,a);ctx.fillText(`${cl}`,lx,H*.5);
ctx.fillStyle=rgba(PAL.accent,a);ctx.fillText(`${cr}`,rx,H*.5);
const mW=W*.15;
ctx.fillStyle=rgba(PAL.text,a*.1);
ctx.fillRect(lx-mW/2,H*.6,mW,H*.02);ctx.fillRect(rx-mW/2,H*.6,mW,H*.02);
ctx.fillStyle=rgba(PAL.fail,a*.7);ctx.fillRect(lx-mW/2,H*.6,mW*ease(ct),H*.02);
ctx.fillStyle=rgba(PAL.accent,a*.7);ctx.fillRect(rx-mW/2,H*.6,mW*ease(ct)*.25,H*.02);
ctx.font=`${W*.016}px system-ui`;ctx.fillStyle=rgba(PAL.text,a*.7);
ctx.fillText('4\u00d7 faster',W*.5,H*.72);
}
function frame(now){
if(__seek!=null)now=__seek;
const t=now%LOOP,b=t/LOOP;
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,W,H);
drawBg();drawBeat1(t,b);drawBeat2(t,b);drawBeat3(t,b);drawBeat4(t,b);
ctx.fillStyle=rgba(PAL.accent,.3);ctx.fillRect(0,H-2,W*b,2);
requestAnimationFrame(frame);
}
function resize(){
dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
buildLayout();
}
window.addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
