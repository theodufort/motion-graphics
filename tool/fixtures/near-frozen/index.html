<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>contained label fixture</title>
<style>body{margin:0;background:#090909}canvas{display:block}</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const LOOP = 8000;
window.__loop = LOOP;
let W = 960, H = 540, __seek = null;
canvas.width = W; canvas.height = H;
window.__time = (v) => { __seek = v; };
function frame(now) {
  if (__seek != null) now = __seek;
  const t = now % LOOP;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(62,207,142,0.9)";
  ctx.fillRect(200, 350, 300 + 40 * Math.sin(t / 8000), 100);
  ctx.textAlign = "center";
  ctx.font = "700 64px monospace";
  ctx.fillStyle = "rgba(237,237,237,0.95)";
  ctx.fillText("big label", 480, 200);
  ctx.font = "400 14px monospace";
  ctx.fillStyle = "rgba(237,237,237,0.95)";
  ctx.fillText("tiny", 480, 195); // fully inside the big label's rect
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
