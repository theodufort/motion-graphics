<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>same color fixture</title>
<style>body{margin:0;background:#090909}canvas{display:block}</style></head>
<body>
<canvas id="stage"></canvas>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const LOOP = 4000;
window.__loop = LOOP;
let W = 960, H = 540, __seek = null;
canvas.width = W; canvas.height = H;
window.__time = (v) => { __seek = v; };
function frame(now) {
  if (__seek != null) now = __seek;
  const t = now % LOOP;
  const beat = t / LOOP;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0b0d12"; ctx.fillRect(0, 0, W, H);
  // two labels with the SAME fill color, overlapping by 40px
  // (simulates a multi-line label drawn as two fillText calls)
  ctx.fillStyle = "#3ecf8e"; ctx.font = "18px monospace";
  ctx.fillText("line one label", 100, 200);
  ctx.fillText("line two label", 120, 200); // overlaps by ~40px
  // moving element
  const px = 100 + beat * 400;
  ctx.fillStyle = "#f00"; ctx.beginPath(); ctx.arc(px, 400, 15, 0, 7); ctx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
