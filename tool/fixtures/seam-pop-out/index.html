<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>seam pop out fixture</title>
<style>body{margin:0;background:#090909}canvas{display:block}</style></head>
<body>
<canvas id="stage"></canvas>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const LOOP = 8000;
window.__loop = LOOP;
let W = 960, H = 540, __seek = null;
canvas.width = W; canvas.height = H;
window.__time = (v) => { __seek = v; };
function frame(now) {
  if (__seek != null) now = __seek; // validator-pinned: always draw the seeked frame
  const t = now % LOOP;
  const beat = t / LOOP;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0b0d12"; ctx.fillRect(96, 96, W - 192, H - 192);
  const x = 250 + beat * 460;
  ctx.fillStyle = "#4da3ff"; ctx.beginPath(); ctx.arc(x, 200, 14, 0, 7); ctx.fill();
  ctx.font = "18px monospace"; ctx.fillStyle = "#fff";
  ctx.fillText("seam pop out", 250, 350);
  // visible for beat in [0.1, 0.97): alpha=1 at seam-a (t=LOOP-300, beat=0.9625),
  // alpha=0 at seam-b (t=300, beat=0.0375) -> a pop-out, the mirror of pop-in.
  // (a legitimate fade-out beat would ramp alpha down; this one drops hard)
  if (beat > 0.1 && beat < 0.97) { ctx.fillStyle = "#31c48d"; ctx.fillText("fades before wrap", 520, 430); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
