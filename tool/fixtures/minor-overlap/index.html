<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>minor overlap fixture</title>
<style>body{margin:0;background:#090909}canvas{display:block}</style></head>
<body>
<canvas id="stage"></canvas>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const LOOP = 4000;
window.__loop = LOOP;
let W = 960, H = 540, __seek = null;
canvas.width = W; canvas.height = H;
window.__time = (v) => { __seek = v; };
function frame(now) {
  if (__seek != null) now = __seek;
  const t = now % LOOP;
  const beat = t / LOOP;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0b0d12"; ctx.fillRect(0, 0, W, H);
  // two labels overlapping by ~10px horizontally (hairline touch)
  ctx.fillStyle = "#fff"; ctx.font = "18px monospace";
  ctx.fillText("alpha", 100, 200);
  // "beta" overlaps horizontally by ~6px, vertically by ~50% (shifted down)
  ctx.fillText("beta", 149, 208);
  // moving element for frozen check
  const px = 100 + beat * 400;
  ctx.fillStyle = "#f00"; ctx.beginPath(); ctx.arc(px, 400, 15, 0, 7); ctx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
