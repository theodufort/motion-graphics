<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>lost label seam fixture</title>
<style>body{margin:0;background:#090909}canvas{display:block}</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const LOOP = 8000;
window.__loop = LOOP;
let W = 960, H = 540, __seek = null;
canvas.width = W; canvas.height = H;
window.__time = (v) => { __seek = v; };
function frame(now) {
  if (__seek != null) now = __seek;
  const t = now % LOOP;
  const beat = t / LOOP;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(62,207,142,0.9)";
  ctx.fillRect(W * 0.3 + Math.sin(beat * 6.28) * 40, H * 0.45, 300, 120);
  ctx.font = "700 22px monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(237,237,237,0.95)";
  // this label is shown only during beat 0.95..1.0 (the seam-a window)
  // and never again -> seam label continuity must flag it
  if (beat > 0.95) ctx.fillText("fading soul", 480, 180);
  ctx.fillStyle = "rgba(237,237,237,0.95)";
  ctx.fillText("steady label", 480, 400);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
