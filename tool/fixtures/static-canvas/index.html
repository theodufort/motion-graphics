<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>static fixture</title>
<style>body{margin:0;background:#090909}canvas{display:block}</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const LOOP = 8000;
window.__loop = LOOP;
let W = 960, H = 540, __seek = null;
canvas.width = W; canvas.height = H;
window.__time = (v) => { __seek = v; };
function frame() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(62,207,142,0.9)";
  ctx.fillRect(300, 200, 360, 140);
  ctx.font = "700 24px monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(237,237,237,0.95)";
  ctx.fillText("frozen frame", 480, 270);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
