<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CDN Cache Hit vs Miss</title>
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=30000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr;
const lerp=(a,b,t)=>a+(b-a)*t, clamp01=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const fade=(t,a,b,edge=.8)=>{if(t<a||t>=b)return 0;const f=(t-a)/(b-a);return f<edge?ease(f/edge):1-ease((f-edge)/(1-edge))};
const quad=(a,c,b,t)=>{const u=1-t;return{x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y}};
let __seek=null;
window.__time=v=>{__seek=v};
window.__loop=LOOP;
const nodes=[
  {id:'client',label:'Client',x:.15,y:.5,r:22},
  {id:'cdn',label:'CDN Edge',x:.5,y:.42,r:28},
  {id:'origin',label:'Origin',x:.85,y:.5,r:22}
];
const conns=[
  {from:'client',to:'cdn',cp:{x:.32,y:.28}},
  {from:'cdn',to:'origin',cp:{x:.68,y:.28}}
];
const packets=[
  {from:'client',to:'cdn',t0:.5,t1:2,col:'muted',r:5},
  {from:'cdn',to:'client',t0:2,t1:3.2,col:'accent',r:6},
  {from:'client',to:'cdn',t0:8.5,t1:10,col:'muted',r:5},
  {from:'cdn',to:'origin',t0:10,t1:12,col:'fail',r:5},
  {from:'origin',to:'cdn',t0:12,t1:14,col:'fail',r:5},
  {from:'cdn',to:'client',t0:14,t1:15.5,col:'fail',r:6},
  {from:'client',to:'cdn',t0:16.5,t1:18,col:'muted',r:5},
  {from:'cdn',to:'client',t0:18,t1:19.2,col:'accent',r:6},
  {from:'cdn',to:'origin',t0:19,t1:21.5,col:'muted',r:4},
  {from:'origin',to:'cdn',t0:21.5,t1:23,col:'muted',r:4}
];
const beats=[
  {t0:0,t1:8,label:'CACHE HIT',sub:'12 ms · edge response',col:'accent'},
  {t0:8,t1:16,label:'CACHE MISS',sub:'240 ms · origin fetch',col:'fail'},
  {t0:16,t1:24,label:'STALE-WHILE-REVALIDATE',sub:'serve stale · refresh bg',col:'accent'},
  {t0:24,t1:30,label:'METRICS',sub:'hit rate · latency',col:'text'}
];
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function nodePos(n){return{x:W*n.x,y:H*n.y}}
function drawBg(t){
  ctx.fillStyle=rgba(PAL.bg,1);ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=rgba(PAL.text,.03);ctx.lineWidth=1;
  const g=60;
  for(let x=0;x<W;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function drawConns(t){
  conns.forEach(c=>{
    const a=nodePos(nodes.find(n=>n.id===c.from)),b=nodePos(nodes.find(n=>n.id===c.to));
    const cp={x:W*c.cp.x,y:H*c.cp.y};
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cp.x,cp.y,b.x,b.y);
    ctx.strokeStyle=rgba(PAL.muted,.15);ctx.lineWidth=1.5;ctx.stroke();
  });
}
function drawNodes(t){
  nodes.forEach(n=>{
    const p=nodePos(n),pulse=1+.08*Math.sin(t/400+n.x*10);
    const r=n.r*pulse;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.5);
    const col=n.id==='cdn'?PAL.accent:n.id==='origin'?PAL.fail:PAL.muted;
    g.addColorStop(0,rgba(col,.25));g.addColorStop(1,rgba(col,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgba(PAL.bg,1);ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=rgba(col,.7);ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=rgba(PAL.text,.9);ctx.font=`600 ${Math.max(11,W*.012)}px system-ui`;ctx.textAlign='center';
    ctx.fillText(n.label,p.x,p.y+r+18);
  });
}
function drawPackets(t){
  packets.forEach(p=>{
    const s=(p.t0/1000)*1000,e=(p.t1/1000)*1000;
    const ts=t/1000;
    if(ts<p.t0||ts>=p.t1)return;
    const prog=ease(clamp01((ts-p.t0)/(p.t1-p.t0)));
    const a=nodePos(nodes.find(n=>n.id===p.from)),b=nodePos(nodes.find(n=>n.id===p.to));
    const cIdx=p.from==='client'?0:1;
    const cp={x:W*conns[cIdx].cp.x,y:H*conns[cIdx].cp.y};
    const pos=quad(a,cp,b,prog);
    const col=PAL[p.col];
    for(let i=5;i>=0;i--){
      const tp=clamp01(prog-i*.04);
      if(tp<0)continue;
      const tp2=quad(a,cp,b,tp);
      ctx.fillStyle=rgba(col,.12*(1-i/6));
      ctx.beginPath();ctx.arc(tp2.x,tp2.y,p.r*(1-i*.12),0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=rgba(col,.95);ctx.beginPath();ctx.arc(pos.x,pos.y,p.r,0,Math.PI*2);ctx.fill();
  });
}
function drawHud(t){
  const ts=t/1000;
  beats.forEach((b,i)=>{
    const a=fade(ts,b.t0,b.t1,1);
    if(a<=0)return;
    const col=PAL[b.col];
    ctx.globalAlpha=a;
    ctx.fillStyle=rgba(col,.9);ctx.font=`700 ${Math.max(18,W*.022)}px system-ui`;ctx.textAlign='center';
    ctx.fillText(b.label,W*.5,H*.12);
    ctx.fillStyle=rgba(PAL.muted,.8);ctx.font=`400 ${Math.max(12,W*.013)}px system-ui`;
    ctx.fillText(b.sub,W*.5,H*.12+24);
    if(i===3){
      const fill=ease(clamp01((ts-24.5)/3));
      const mw=W*.3,mx=W*.5-mw/2,my=H*.72,mh=14;
      ctx.fillStyle=rgba(PAL.muted,.15);ctx.fillRect(mx,my,mw,mh);
      ctx.fillStyle=rgba(PAL.accent,.8);ctx.fillRect(mx,my,mw*fill*.94,mh);
      ctx.fillStyle=rgba(PAL.text,.9);ctx.font=`600 ${Math.max(13,W*.014)}px system-ui`;
      ctx.fillText(`${Math.round(fill*94)}% hit rate`,W*.5,my-10);
      const lw=W*.12;
      ctx.fillStyle=rgba(PAL.accent,.7);ctx.fillRect(W*.35,H*.82,lw*(12/240),10);
      ctx.fillStyle=rgba(PAL.fail,.7);ctx.fillRect(W*.55,H*.82,lw,10);
      ctx.fillStyle=rgba(PAL.muted,.7);ctx.font=`400 ${Math.max(11,W*.011)}px system-ui`;
      ctx.fillText('12ms',W*.35+lw*.025,H*.82+26);ctx.fillText('240ms',W*.55+lw*.5,H*.82+26);
    }
    ctx.globalAlpha=1;
  });
}
function frame(now){
  if(__seek!=null)now=__seek;
  const t=now%LOOP;
  ctx.clearRect(0,0,W,H);
  drawBg(t);drawConns(t);drawNodes(t);drawPackets(t);drawHud(t);
  requestAnimationFrame(frame);
}
resize();window.addEventListener('resize',resize);requestAnimationFrame(frame);
</script>
</body>
</html>
