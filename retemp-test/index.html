<!DOCTYPE html><html><head><meta charset="utf-8"><title>retemp test</title></head>
<body style="margin:0"><canvas id="c" width="1280" height="720"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");const LOOP=8000;
function draw(t){const p=t/LOOP;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#0b0d12";ctx.fillRect(40,40,c.width-80,c.height-80);
const x=300+p*680;ctx.fillStyle="#4da3ff";ctx.beginPath();ctx.arc(x,300,16,0,7);ctx.fill();
ctx.font="18px monospace";ctx.fillStyle="#fff";ctx.fillText("retemp test",300,450);
const r=20+8*Math.sin(p*12.56);ctx.fillStyle="#31c48d";ctx.beginPath();ctx.arc(900,450,r,0,7);ctx.fill();}
let fr=false;function loop(){if(!fr)draw(performance.now()%LOOP);requestAnimationFrame(loop);}loop();
window.__time=(t)=>{t=t%LOOP;fr=true;draw(t);};
</script></body></html>
