<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0}
body{background:var(--bg);overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// setup
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=30000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr;
function buildLayout(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
// easing
const lerp=(a,b,t)=>a+(b-a)*t,clamp01=t=>Math.max(0,Math.min(1,t));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const fade=(t,s,e,ed=.05)=>{if(t<s||t>=e)return 0;return Math.min(clamp01((t-s)/ed),clamp01((e-t)/ed))};
// data
const nodes=[
{id:'token',x:.5,y:.16,label:'JWT Token',c:'accent'},
{id:'header',x:.2,y:.42,label:'Header',c:'text'},
{id:'payload',x:.5,y:.42,label:'Payload',c:'text'},
{id:'sig',x:.8,y:.42,label:'Signature',c:'text'},
{id:'key',x:.8,y:.74,label:'Secret Key',c:'muted'},
{id:'claims',x:.3,y:.74,label:'Claims',c:'accent'}
];
const packets=[
{f:'token',t:'header',s:.04,e:.22},{f:'token',t:'payload',s:.04,e:.22},{f:'token',t:'sig',s:.04,e:.22},
{f:'sig',t:'key',s:.42,e:.54},{f:'key',t:'sig',s:.54,e:.64},
{f:'payload',t:'claims',s:.68,e:.82}
];
const beats=[{s:0,e:.17,l:'Decode'},{s:.17,e:.40,l:'Parse JSON'},{s:.40,e:.65,l:'Verify Signature'},{s:.65,e:.90,l:'Extract Claims'},{s:.90,e:1,l:'Valid ✓'}];
const claims=['sub: user_42','exp: 1719…','role: admin'];
// hooks
let __seek=null;
window.__time=v=>{__seek=v};
window.__loop=LOOP;
// helpers
const np=n=>({x:n.x*W,y:n.y*H});
const quad=(a,c,b,t)=>{const u=1-t;return{x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y}};
// frame
function frame(now){
if(__seek!=null)now=__seek;
const t=now%LOOP,beat=t/LOOP;
ctx.clearRect(0,0,W,H);
// grid
ctx.strokeStyle=rgba(PAL.text,.03);ctx.lineWidth=1;
for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
// beat label
const ab=beats.find(b=>beat>=b.s&&beat<b.e);
if(ab){const ba=fade(beat,ab.s,ab.e,.04);ctx.font=`600 ${W*.022}px system-ui`;ctx.fillStyle=rgba(PAL.accent,ba*.9);ctx.textAlign='center';ctx.fillText(ab.l,W*.5,H*.055)}
// connections
packets.forEach(p=>{
const a=np(nodes.find(n=>n.id===p.f)),b=np(nodes.find(n=>n.id===p.t));
const c={x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-H*.09};
const pa=fade(beat,p.s,p.e,.04);
if(pa>0){ctx.strokeStyle=rgba(PAL.accent,pa*.15);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.x,c.y,b.x,b.y);ctx.stroke()}
});
// nodes
nodes.forEach(n=>{
const p=np(n),pulse=1+Math.sin(now/400)*.06,r=W*.017*pulse,na=fade(beat,0,1,.02);
const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.5);g.addColorStop(0,rgba(PAL[n.c],na*.1));g.addColorStop(1,rgba(PAL[n.c],0));
ctx.fillStyle=g;ctx.fillRect(p.x-r*2.5,p.y-r*2.5,r*5,r*5);
ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=rgba(PAL[n.c],na*.18);ctx.fill();ctx.strokeStyle=rgba(PAL[n.c],na*.65);ctx.lineWidth=1.5;ctx.stroke();
ctx.font=`500 ${W*.013}px system-ui`;ctx.fillStyle=rgba(PAL.text,na*.85);ctx.textAlign='center';ctx.fillText(n.label,p.x,p.y+r+W*.018);
});
// packets
packets.forEach(p=>{
const a=np(nodes.find(n=>n.id===p.f)),b=np(nodes.find(n=>n.id===p.t));
const c={x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-H*.09};
const dur=(p.e-p.s)*LOOP,el=t-p.s*LOOP;
if(el>0&&el<dur){
const pt=ease(clamp01(el/dur)),pos=quad(a,c,b,pt);
for(let i=4;i>=1;i--){const tt=clamp01(pt-i*.04),tp=quad(a,c,b,tt);ctx.beginPath();ctx.arc(tp.x,tp.y,W*.003*(1-i*.18),0,Math.PI*2);ctx.fillStyle=rgba(PAL.accent,.35*(1-i*.2));ctx.fill()}
ctx.beginPath();ctx.arc(pos.x,pos.y,W*.006,0,Math.PI*2);ctx.fillStyle=rgba(PAL.accent,.9);ctx.fill();
}});
// token segments
const ta=fade(beat,0,.32,.05);
if(ta>0){
const segs=['eyJhbGciOi…','eyJzdWIiOi…','SflKxwRJ…'],sw=W*.13;
segs.forEach((s,i)=>{
const sx=W*.5-sw*1.5+i*sw*1.1,split=clamp01((beat-.04)/.1),ox=(i-1)*split*W*.07;
ctx.font=`400 ${W*.011}px monospace`;ctx.fillStyle=rgba(PAL.muted,ta*.7);ctx.textAlign='center';ctx.fillText(s,sx+ox,H*.22);
});
}
// claims
const ca=fade(beat,.65,.92,.05);
if(ca>0){claims.forEach((c,i)=>{const c2=clamp01((beat-.68-i*.04)/.06);ctx.font=`400 ${W*.012}px monospace`;ctx.fillStyle=rgba(PAL.accent,ca*c2*.8);ctx.textAlign='center';ctx.fillText(c,W*.3,H*.8+i*H*.032)})}
// checkmark
const va=fade(beat,.42,.65,.05);
if(va>0){const prog=clamp01((beat-.55)/.08);ctx.font=`600 ${W*.02}px system-ui`;ctx.fillStyle=rgba(PAL.accent,va*prog);ctx.textAlign='center';ctx.fillText(prog>.9?'✓ Valid':'…',W*.8,H*.6)}
requestAnimationFrame(frame);
}
buildLayout();
addEventListener('resize',buildLayout);
requestAnimationFrame(frame);
</script>
</body>
</html>
