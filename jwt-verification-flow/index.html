<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT Verification Flow</title>
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
canvas#stage{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById("stage");
var ctx=canvas.getContext("2d");
var LOOP=30000;
var PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
function rgba(c,a){return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
var W=0,H=0,dpr=1;
function resize(){
dpr=window.devicePixelRatio||1;
W=window.innerWidth;H=window.innerHeight;
canvas.width=W*dpr;canvas.height=H*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);
}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp01(t){return Math.max(0,Math.min(1,t));}
function easeInOut(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function beatAlpha(t,s,e,f){
f=f||0.03;
if(t<s||t>e)return 0;
if(t<s+f)return easeInOut((t-s)/f);
if(t>e-f)return easeInOut((e-t)/f);
return 1;
}
function quad(a,c,b,t){
var u=1-t;
return{x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};
}
function layout(){
return{
title:{x:W*0.5,y:H*0.065},
token:{x:W*0.5,y:H*0.26},
left:{x:W*0.2,y:H*0.58},
right:{x:W*0.8,y:H*0.58},
bottom:{x:W*0.5,y:H*0.84}
};
}
function drawGrid(t){
var sp=W*0.06;
var off=(t*0.008)%sp;
ctx.strokeStyle=rgba(PAL.text,0.03);
ctx.lineWidth=1;
ctx.beginPath();
for(var x=-sp+off;x<W+sp;x+=sp){ctx.moveTo(x,0);ctx.lineTo(x,H);}
for(var y=-sp+off*0.5;y<H+sp;y+=sp){ctx.moveTo(0,y);ctx.lineTo(W,y);}
ctx.stroke();
}
function drawTitle(t){
var L=layout();
var a=beatAlpha(t,0,1,0.02);
var pulse=1+0.01*Math.sin(t/400);
ctx.save();
ctx.translate(L.title.x,L.title.y);
ctx.scale(pulse,pulse);
ctx.font="bold "+Math.round(H*0.045)+"px system-ui,sans-serif";
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillStyle=rgba(PAL.text,a*0.9);
ctx.fillText("JWT Verification",0,0);
ctx.restore();
}
function drawToken(t){
var L=layout();
var a=beatAlpha(t,0,1,0.02);
var split=clamp01((t-1500)/3500);
split=easeInOut(split);
var segW=W*0.1;
var gap=W*0.015*split;
var totalW=segW*3+gap*2;
var startX=L.token.x-totalW/2;
var y=L.token.y;
var h=H*0.055;
var pulse=1+0.015*Math.sin(t/350);
ctx.save();
ctx.translate(L.token.x,y);
ctx.scale(pulse,pulse);
ctx.translate(-L.token.x,-y);
var segs=[
{label:"Header",color:PAL.accent,w:segW*0.8},
{label:"Payload",color:PAL.text,w:segW*1.2},
{label:"Signature",color:PAL.muted,w:segW*0.8}
];
var cx=startX;
for(var i=0;i<3;i++){
var s=segs[i];
var sw=s.w*(1+0.05*split);
var glow=0.3+0.15*Math.sin(t/300+i*1.2);
ctx.fillStyle=rgba(s.color,a*glow);
roundRect(cx,y-h/2,sw,h,h*0.3);
ctx.fill();
ctx.strokeStyle=rgba(s.color,a*0.5);
ctx.lineWidth=1.5;
roundRect(cx,y-h/2,sw,h,h*0.3);
ctx.stroke();
ctx.font="bold "+Math.round(H*0.022)+"px system-ui,sans-serif";
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillStyle=rgba(PAL.bg,a*0.9);
ctx.fillText(s.label,cx+sw/2,y);
cx+=sw+gap;
}
ctx.restore();
}
function roundRect(x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}
function drawPanel(x,y,w,h,a,label,lines,t){
var pulse=1+0.008*Math.sin(t/500+x*0.01);
ctx.save();
ctx.translate(x,y);
ctx.scale(pulse,pulse);
ctx.translate(-x,-y);
ctx.fillStyle=rgba(PAL.bg,a*0.85);
roundRect(x-w/2,y-h/2,w,h,h*0.08);
ctx.fill();
ctx.strokeStyle=rgba(PAL.accent,a*0.4);
ctx.lineWidth=1.5;
roundRect(x-w/2,y-h/2,w,h,h*0.08);
ctx.stroke();
ctx.font="bold "+Math.round(H*0.024)+"px system-ui,sans-serif";
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillStyle=rgba(PAL.accent,a*0.9);
ctx.fillText(label,x,y-h/2+H*0.03);
var ly=y-h/2+H*0.06;
ctx.font=Math.round(H*0.02)+"px monospace";
ctx.textAlign="left";
for(var i=0;i<lines.length;i++){
ctx.fillStyle=rgba(PAL.text,a*0.8);
ctx.fillText(lines[i],x-w/2+W*0.03,ly+i*H*0.032);
}
ctx.restore();
}
function drawPackets(t,from,to,ctrl,startMs,dur,count){
var elapsed=t-startMs;
if(elapsed<0)return;
for(var i=0;i<count;i++){
var pt=elapsed/dur-i*0.25;
if(pt<0||pt>1)continue;
var e=easeInOut(clamp01(pt));
var pos=quad(from,ctrl,to,e);
var trail=0.6*(1-pt);
for(var j=0;j<5;j++){
var tt=clamp01(e-j*0.04);
var tp=quad(from,ctrl,to,tt);
var ta=trail*(1-j*0.18);
ctx.beginPath();
ctx.arc(tp.x,tp.y,3-j*0.4,0,Math.PI*2);
ctx.fillStyle=rgba(PAL.accent,ta);
ctx.fill();
}
}
}
function drawDecode(t){
var a=beatAlpha(t,0.167,0.42,0.03);
if(a<=0)return;
var L=layout();
var lw=W*0.28,lh=H*0.22;
drawPanel(L.left.x,L.left.y,lw,lh,a,"Header",["{ alg: HS256","  typ: JWT }"],t);
drawPanel(L.right.x,L.right.y,lw,lh,a,"Payload",["{ sub: user_42","  exp: 1719849600","  role: admin }"],t);
var fromH={x:L.token.x-W*0.12,y:L.token.y};
var toH={x:L.left.x+W*0.1,y:L.left.y-H*0.1};
var ctrlH={x:L.token.x-W*0.15,y:L.token.y-H*0.12};
drawPackets(t,fromH,toH,ctrlH,5000,3000,3);
var fromP={x:L.token.x+W*0.12,y:L.token.y};
var toP={x:L.right.x-W*0.1,y:L.right.y-H*0.1};
var ctrlP={x:L.token.x+W*0.15,y:L.token.y-H*0.12};
drawPackets(t,fromP,toP,ctrlP,5500,3000,3);
}
function drawSignature(t){
var a=beatAlpha(t,0.4,0.68,0.03);
if(a<=0)return;
var L=layout();
var bw=W*0.35,bh=H*0.14;
var bx=L.bottom.x,by=L.bottom.y;
var pulse=1+0.01*Math.sin(t/380);
ctx.save();
ctx.translate(bx,by);
ctx.scale(pulse,pulse);
ctx.translate(-bx,-by);
ctx.fillStyle=rgba(PAL.bg,a*0.85);
roundRect(bx-bw/2,by-bh/2,bw,bh,bh*0.1);
ctx.fill();
ctx.strokeStyle=rgba(PAL.accent,a*0.5);
ctx.lineWidth=1.5;
roundRect(bx-bw/2,by-bh/2,bw,bh,bh*0.1);
ctx.stroke();
ctx.font="bold "+Math.round(H*0.022)+"px system-ui,sans-serif";
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillStyle=rgba(PAL.accent,a*0.9);
ctx.fillText("Signature Check",bx,by-bh/2+H*0.025);
var meterW=bw*0.7;
var meterH=H*0.018;
var mx=bx-meterW/2,my=by;
var fillT=clamp01((t-13000)/4000);
fillT=easeInOut(fillT);
ctx.fillStyle=rgba(PAL.muted,a*0.3);
roundRect(mx,my-meterH/2,meterW,meterH,meterH/2);
ctx.fill();
ctx.fillStyle=rgba(PAL.accent,a*0.8);
roundRect(mx,my-meterH/2,meterW*fillT,meterH,meterH/2);
ctx.fill();
ctx.font=Math.round(H*0.018)+"px monospace";
ctx.fillStyle=rgba(PAL.text,a*0.7);
ctx.fillText("HMAC-SHA256(key, h.p) === sig",bx,my+H*0.035);
var checkT=clamp01((t-17500)/1500);
if(checkT>0){
var cs=easeInOut(checkT);
ctx.save();
ctx.translate(bx+bw/2-W*0.02,by);
ctx.scale(cs,cs);
ctx.strokeStyle=rgba(PAL.accent,a);
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(-W*0.012,0);
ctx.lineTo(-W*0.004,W*0.01);
ctx.lineTo(W*0.015,-W*0.012);
ctx.stroke();
ctx.restore();
}
ctx.restore();
var from={x:L.token.x,y:L.token.y+H*0.03};
var to={x:bx,by:by-bh/2};
var ctrl={x:L.token.x,y:L.token.y+H*0.12};
drawPackets(t,from,{x:bx,y:by-bh/2},ctrl,12500,2500,2);
}
function drawClaims(t){
var a=beatAlpha(t,0.667,0.92,0.03);
if(a<=0)return;
var L=layout();
var claims=[
{label:"exp",val:"1719849600",status:"Valid"},
{label:"sub",val:"user_42",status:"Valid"},
{label:"role",val:"admin",status:"Valid"}
];
var startY=L.right.y-H*0.08;
var rowH=H*0.045;
for(var i=0;i<claims.length;i++){
var ca=beatAlpha(t,0.667+i*0.04,0.92,0.02);
if(ca<=0)continue;
var ry=startY+i*rowH;
var cx=L.right.x;
var cw=W*0.22;
ctx.fillStyle=rgba(PAL.bg,ca*0.7);
roundRect(cx-cw/2,ry-rowH*0.35,cw,rowH*0.7,rowH*0.2);
ctx.fill();
ctx.strokeStyle=rgba(PAL.accent,ca*0.3);
ctx.lineWidth=1;
roundRect(cx-cw/2,ry-rowH*0.35,cw,rowH*0.7,rowH*0.2);
ctx.stroke();
ctx.font="bold "+Math.round(H*0.019)+"px monospace";
ctx.textAlign="left";ctx.textBaseline="middle";
ctx.fillStyle=rgba(PAL.accent,ca*0.9);
ctx.fillText(claims[i].label,cx-cw/2+W*0.02,ry);
ctx.fillStyle=rgba(PAL.text,ca*0.8);
ctx.fillText(claims[i].val,cx-cw/2+W*0.07,ry);
var checkT=clamp01((t-(21000+i*1500))/800);
if(checkT>0){
var cs=easeInOut(checkT);
ctx.save();
ctx.translate(cx+cw/2-W*0.025,ry);
ctx.scale(cs,cs);
ctx.strokeStyle=rgba(PAL.accent,ca);
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(-W*0.008,0);
ctx.lineTo(-W*0.003,W*0.007);
ctx.lineTo(W*0.01,-W*0.009);
ctx.stroke();
ctx.restore();
}
}
}
function drawVerified(t){
var a=beatAlpha(t,0.9,1,0.03);
if(a<=0)return;
var L=layout();
var pulse=1+0.03*Math.sin(t/250);
ctx.save();
ctx.translate(L.token.x,L.token.y+H*0.1);
ctx.scale(pulse,pulse);
ctx.font="bold "+Math.round(H*0.04)+"px system-ui,sans-serif";
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillStyle=rgba(PAL.accent,a);
ctx.fillText("✓ Verified",0,0);
ctx.restore();
var ringR=H*0.04*(1+0.1*Math.sin(t/300));
ctx.beginPath();
ctx.arc(L.token.x,L.token.y+H*0.1,ringR,0,Math.PI*2);
ctx.strokeStyle=rgba(PAL.accent,a*0.3);
ctx.lineWidth=2;
ctx.stroke();
}
function drawHud(t){
var L=layout();
var beat=t/LOOP;
var labels=["Split","Decode","Signature","Claims","Verified"];
var idx=Math.min(4,Math.floor(beat*5));
var la=beatAlpha(t,0,1,0.02);
ctx.font=Math.round(H*0.016)+"px system-ui,sans-serif";
ctx.textAlign="left";ctx.textBaseline="top";
ctx.fillStyle=rgba(PAL.muted,la*0.6);
ctx.fillText("Step "+(idx+1)+"/5: "+labels[idx],W*0.03,H*0.03);
var barW=W*0.12;
var barH=H*0.008;
var bx=W*0.03,by=H*0.055;
ctx.fillStyle=rgba(PAL.muted,la*0.2);
roundRect(bx,by,barW,barH,barH/2);
ctx.fill();
ctx.fillStyle=rgba(PAL.accent,la*0.7);
roundRect(bx,by,barW*beat,barH,barH/2);
ctx.fill();
}
var __seek=null;
window.__time=function(v){__seek=v;};
window.__loop=LOOP;
var lastNow=0;
function frame(now){
if(__seek!=null)now=__seek;
var t=now%LOOP;
ctx.clearRect(0,0,W,H);
ctx.fillStyle=rgba(PAL.bg,1);
ctx.fillRect(0,0,W,H);
drawGrid(t);
drawTitle(t);
drawToken(t);
drawDecode(t);
drawSignature(t);
drawClaims(t);
drawVerified(t);
drawHud(t);
lastNow=now;
requestAnimationFrame(frame);
}
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
