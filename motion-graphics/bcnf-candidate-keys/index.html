<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BCNF — Every Determinant a Candidate Key</title>
    <link rel="stylesheet" href="../css/brand.css">
    <link rel="stylesheet" href="../css/motion.css">
    <style>
        body {
            margin: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="stage"></canvas>
    <script>
        "use strict";
        /* ================= BCNF — every determinant must be a candidate key ================= */
        const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');

        const cv = getComputedStyle(document.documentElement);
        const tok = n => cv.getPropertyValue(n).trim();
        function pc(s) {
            s = s.trim();
            if (s[0] === '#') {
                let h = s.slice(1); if (h.length === 3) h = h.split('').map(c => c + c).join('');
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]
            }
            const m = s.match(/[\d.]+/g).map(Number); return m.length >= 3 ? m.slice(0, 3) : [255, 255, 255]
        }
        const P = {
            accent: pc(tok('--accent')), g5: pc(tok('--green-5')), fail: pc(tok('--fail')),
            text: pc(tok('--text')), muted: pc(tok('--muted')), surf: pc(tok('--surface')), bg2: pc(tok('--bg-2'))
        };
        const FS = tok('--font-sans'), FM = tok('--font-mono');
        const R = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
        const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
        const lerp = (a, b, t) => a + (b - a) * t, cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
        const eio = t => t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        const flash = (t, t0, dur) => { const x = (t - t0) / dur; return x >= 0 && x <= 1 ? 1 - Math.abs(1 - 2 * x) : 0 };

        let W, H;
        function resize() {
            const d = devicePixelRatio || 1;
            W = Math.min(innerWidth - 32, 1100); H = Math.round(W * 9 / 16);
            canvas.width = W * d; canvas.height = H * d; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(d, 0, 0, d, 0, 0)
        }
        addEventListener('resize', resize); resize();

        const LOOP = 24000;
        function fw(t, s, d, f = 1200) { const x = ((t - s) % LOOP + LOOP) % LOOP; if (x > d) return 0; return Math.min(1, x / f, (d - x) / f) }
        const fA = t => fw(t, 23000, 11200);
        const fC = t => fw(t, 9000, 14400);

        function rr(x, y, w, h, r) {
            ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath()
        }
        function grid() {
            ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
            const s = Math.max(36, W * .042);
            for (let x = 0; x < W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke() }
            for (let y = 0; y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke() } ctx.restore()
        }
        function title(main, sub) {
            ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            ctx.font = `800 ${W * .05}px ${FM}`; ctx.fillStyle = R(P.accent, .95); ctx.fillText(main, W * .045, H * .105);
            const mw = ctx.measureText(main).width;
            ctx.font = `700 ${W * .0165}px ${FS}`; ctx.fillStyle = R(P.muted, 1);
            ctx.fillText(sub, W * .045 + mw + W * .018, H * .105 - W * .002); ctx.restore()
        }
        function badge(x, y, txt, col, fs) {
            fs = fs || W * .0155; ctx.save();
            ctx.font = `700 ${fs}px ${FM}`;
            const w = ctx.measureText(txt).width + fs * 1.7, h = fs * 2.0;
            ctx.fillStyle = R(col, .13); rr(x, y, w, h, h / 2); ctx.fill();
            ctx.strokeStyle = R(col, .55); ctx.lineWidth = 1; rr(x, y, w, h, h / 2); ctx.stroke();
            ctx.fillStyle = R(col, .95); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(txt, x + w / 2, y + h / 2 + 1); ctx.restore(); return w
        }
        function stat(x, y, label, val, col) {
            ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            ctx.font = `700 ${W * .0135}px ${FS}`; ctx.fillStyle = R(P.muted, 1); ctx.fillText(label.toUpperCase(), x, y);
            ctx.font = `800 ${W * .032}px ${FM}`; ctx.fillStyle = R(col, .95); ctx.fillText(val, x, y + W * .034); ctx.restore()
        }
        function dot(x, y, c, rad) {
            rad = rad || 5; const g = ctx.createRadialGradient(x, y, 0, x, y, rad * 2.4);
            g.addColorStop(0, R(c, .9)); g.addColorStop(.45, R(c, .35)); g.addColorStop(1, R(c, 0));
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad * 2.4, 0, 7); ctx.fill();
            ctx.fillStyle = R(c, 1); ctx.beginPath(); ctx.arc(x, y, rad * .55, 0, 7); ctx.fill()
        }
        function rule(txt, col) {
            ctx.save(); ctx.font = `600 ${W * .0135}px ${FS}`;
            ctx.fillStyle = col ? R(col, .8) : 'rgba(255,255,255,.32)';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, W / 2, H * .945); ctx.restore()
        }
        function table(o) {
            const x = o.x, y = o.y, w = o.w, hH = o.hH, rH = o.rH, head = o.head, rows = o.rows, cells = o.cells || {}, ghost = o.ghost;
            const n = head.length, ws = head.map(h => h.w || 1), tot = ws.reduce((a, b) => a + b, 0);
            const cw = ws.map(v => v * w / tot), X = [x]; for (let i = 0; i < n; i++)X.push(X[i] + cw[i]);
            ctx.save(); ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
            const allRows = ghost ? rows.concat([[ghost[0], ghost[1], ghost[2]]]) : rows;
            for (let r = 0; r < allRows.length; r++) {
                const isG = r >= rows.length, ry = y + hH + r * rH;
                for (let c = 0; c < n; c++) {
                    const ov = cells[r + ',' + c], cx0 = X[c], ccw = cw[c];
                    ctx.fillStyle = R(P.bg2, .5); rr(cx0 + 2, ry + 2, ccw - 4, rH - 4, 6); ctx.fill();
                    if (isG && ov == null) { ctx.setLineDash([4, 4]); ctx.strokeStyle = R(P.muted, .4); ctx.lineWidth = 1 }
                    else if (ov) {
                        ctx.fillStyle = R(ov.col, .2 * ov.amt); rr(cx0 + 2, ry + 2, ccw - 4, rH - 4, 6); ctx.fill();
                        ctx.strokeStyle = R(ov.col, .3 + .6 * ov.amt); ctx.lineWidth = 1 + .8 * ov.amt
                    }
                    else { ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1 }
                    rr(cx0 + 2, ry + 2, ccw - 4, rH - 4, 6); ctx.stroke(); ctx.setLineDash([]);
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = `600 ${Math.min(rH * .38, w * .017)}px ${FM}`;
                    ctx.fillStyle = isG ? R(P.muted, .55) : (ov ? R(mix(P.text, ov.col, ov.amt), 1) : R(P.text, .92));
                    ctx.fillText(allRows[r][c], cx0 + ccw / 2, ry + rH / 2 + 1);
                }
            }
            for (let c = 0; c < n; c++) {
                const cx0 = X[c], ccw = cw[c], pk = head[c].pk, uk = head[c].uk;
                ctx.fillStyle = R(P.surf, .92); rr(cx0 + 2, y, ccw - 4, hH, 6); ctx.fill();
                if (pk || uk) { ctx.fillStyle = R(uk ? P.g5 : P.accent, .15); rr(cx0 + 2, y, ccw - 4, hH, 6); ctx.fill() }
                ctx.strokeStyle = R(uk ? P.g5 : P.accent, (pk || uk) ? .6 : .14); ctx.lineWidth = (pk || uk) ? 1.4 : 1; rr(cx0 + 2, y, ccw - 4, hH, 6); ctx.stroke();
                ctx.font = `700 ${hH * .36}px ${FM}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                const parts = [head[c].t]; if (pk) parts.push('PK'); if (uk) parts.push('UNIQUE');
                const label = parts.join(' '), tw = ctx.measureText(label).width, dotsN = (pk || uk) ? 1 : 0;
                let tx = cx0 + ccw / 2 - (tw + dotsN * 9) / 2;
                if (dotsN) { ctx.fillStyle = R(uk ? P.g5 : P.accent, .95); ctx.beginPath(); ctx.arc(tx + 2, y + hH / 2, 3, 0, 7); ctx.fill(); tx += 9 }
                ctx.fillStyle = pk || uk ? R(P.text, 1) : R(P.muted, 1);
                ctx.fillText(label, tx, y + hH / 2 + .5);
            }
            ctx.restore();
            return { X, cw, hH, rH, y, w };
        }

        /* ================= story data =================
           rooms: (id PK, room_name, building). room_name → building is a
           dependency, so room_name must be unique (candidate key).          */
        const HEAD = [{ t: 'id', pk: 1, w: .7 }, { t: 'room_name', w: 1.2 }, { t: 'building', w: 1.1 }];
        const ROWS = [['101', 'lobby', 'A wing'], ['205', 'lab', 'A wing'], ['102', 'lobby', 'A wing']];
        const GHOST = ['310', 'lobby', 'B wing'];
        const ROWS2 = [['101', 'lobby', 'A wing'], ['205', 'lab', 'A wing'], ['102', 'foyer', 'A wing']];

        function draw(now) {
            const t = now % LOOP, aA = fA(t), aC = fC(t);
            ctx.clearRect(0, 0, W, H); grid();
            title('BCNF', 'each determinant is a key');
            const hH = H * .05, rH = H * .068, w = W * .66, tx = W * .11, ty = H * .26;

            /* ---- problem: room_name determines building, but name is not unique ---- */
            if (aA > 0.01) {
                const pulse = .3 + .45 * (.5 + .5 * Math.sin(t / 430));
                const cells = { '0,1': { col: P.fail, amt: pulse }, '2,1': { col: P.fail, amt: pulse } };
                const g = table({ x: tx, y: ty, w, hH, rH, alpha: aA, head: HEAD, rows: ROWS, cells });
                ctx.save(); ctx.globalAlpha = aA;
                /* contradiction bracket between the two 'lobby' names */
                const x0 = g.X[2] + g.cw[2] + 10;
                const y1 = ty + hH + rH / 2 + 1, y2 = ty + hH + 2 * rH + rH / 2 + 1;
                ctx.strokeStyle = R(P.fail, .65); ctx.lineWidth = 1.6;
                ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0 + 12, y1);
                ctx.lineTo(x0 + 12, y2); ctx.lineTo(x0, y2); ctx.stroke();
                ctx.font = `700 ${W * .0125}px ${FM}`; ctx.fillStyle = R(P.fail, .92);
                ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText('“lobby” → A wing', x0 + 14, (y1 + y2) / 2 - H * .013);
                ctx.fillText('— but “lobby” is 2 rows', x0 + 14, (y1 + y2) / 2 + H * .013);
                badge(W * .52, H * .16, '✗ name not unique → not a key', P.fail);
                rule('rule — every determinant must be a candidate key');
                ctx.restore();
            }

            /* ---- transition ---- */
            const cross = Math.min(aA, aC);
            if (cross > 0.02) {
                const p = eio(cl((t - 9300) / 1800));
                for (let r = 0; r < 3; r++)dot(W * .90, lerp(H * .3, H * (.3 + r * .09), p), P.accent)
            }

            /* ---- solution: UNIQUE on room_name rejects the duplicate ---- */
            if (aC > 0.01) {
                const ghostIn = cl((t - 12400) / 1300);
                const reject = flash(t, 13900, 1500);
                const head = [{ t: 'id', pk: 1, w: .7 }, { t: 'room_name', uk: 1, w: 1.2 }, { t: 'building', w: 1.1 }];
                const cells = { '2,1': { col: P.g5, amt: .22 + .2 * (.5 + .5 * Math.sin(t / 420)) } };
                const g = table({
                    x: tx, y: ty, w, hH, rH, alpha: aC, head, rows: ROWS2, cells,
                    ghost: ghostIn > .15 ? GHOST : null
                });
                /* fade the ghost row toward red as it gets rejected */
                if (reject > .02) {
                    const ry = ty + hH + 3 * rH;
                    ctx.save(); ctx.globalAlpha = aC * reject * .9;
                    ctx.fillStyle = R(P.fail, .16); rr(tx + 2, ry + 2, w - 4, rH - 4, 6); ctx.fill();
                    /* red X over the row */
                    ctx.strokeStyle = R(P.fail, .9); ctx.lineWidth = 3;
                    const xx = tx + w - 30, yy = ry + rH / 2;
                    ctx.beginPath(); ctx.moveTo(xx - 8, yy - 8); ctx.lineTo(xx + 8, yy + 8);
                    ctx.moveTo(xx + 8, yy - 8); ctx.lineTo(xx - 8, yy + 8); ctx.stroke();
                    ctx.font = `700 ${W * .013}px ${FM}`; ctx.fillStyle = R(P.fail, 1);
                    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
                    ctx.fillText('violates room_name → building (1 name, 2 values)', tx + w - 46, ry + rH + 2);
                    ctx.restore();
                }
                ctx.save(); ctx.globalAlpha = aC;
                if (reject > .1) badge(W * .46, H * .175, '✓ names unique · FD holds', P.accent);
                rule('room_name is unique → determinant becomes a key', P.accent);
                const rowsOk = Math.round(lerp(3, 3, 1));
                stat(tx, H * .82, 'determinants', 3, P.accent);
                stat(tx + W * .17, H * .82, 'candidate keys', reject > .4 ? 3 : 2, P.accent);
                ctx.restore();
            }
        }
        let __seek = null; window.__time = (v) => { __seek = ((v % 24000) + 24000) % 24000 };
        requestAnimationFrame(function frame(now) { draw(__seek == null ? now : __seek); requestAnimationFrame(frame) });
    </script>
</body>

</html>
