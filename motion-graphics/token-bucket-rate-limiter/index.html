<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style></head><body>
<canvas id="stage"></canvas>
<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=30000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
resize();addEventListener('resize',resize);
const lerp=(a,b,t)=>a+(b-a)*t,clamp01=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const quad=(a,c,b,t)=>({x:(1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,y:(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y});
function fade(t,a,b,edge=0.8){if(t<a||t>=b)return 0;const f=(t-a)/(b-a);return f<edge?ease(f/edge):f>1-edge?ease((1-f)/edge):1}
let srcs=[],bucket,meter;
function buildLayout(){
  const bx=W*0.5,by=H*0.5,bw=W*0.12,bh=H*0.35;
  bucket={x:bx-bw/2,y:by-bh/2,w:bw,h:bh};
  srcs=[0,1,2].map(i=>({x:W*0.15,y:H*(0.3+i*0.2),r:W*0.018}));
  meter={x:W*0.8,y:H*0.25,w:W*0.04,h:H*0.5};
}
buildLayout();addEventListener('resize',buildLayout);
function getSpawns(t){
  const spawns=[];
  for(let i=0;i<4;i++){const st=6000+i*2000;if(t>=st&&t<st+1200)spawns.push({t0:st,dur:1200,src:i%3,ok:true})}
  for(let i=0;i<6;i++){const st=14500+i*900;if(t>=st&&t<st+1000)spawns.push({t0:st,dur:1000,src:i%3,ok:true})}
  for(let i=0;i<4;i++){const st=22500+i*1500;if(t>=st&&t<st+1200)spawns.push({t0:st,dur:1200,src:i%3,ok:false})}
  return spawns;
}
function fillLevel(t){
  const b=t/LOOP;
  if(b<0.2)return ease(clamp01(b/0.2));
  if(b<0.467)return lerp(1,0.7,Math.sin((b-0.2)/0.267*Math.PI)*0.5+0.5);
  if(b<0.733)return lerp(1,0.25,ease(clamp01((b-0.467)/0.267)));
  if(b<0.933)return lerp(0.25,0,ease(clamp01((b-0.733)/0.2)));
  return 0;
}
function acceptedCount(t){
  const b=t/LOOP;
  if(b<0.2)return 0;
  if(b<0.467)return Math.floor((b-0.2)/0.267*4);
  if(b<0.733)return 4+Math.floor((b-0.467)/0.267*6);
  return 10;
}
let __seek=null;
window.__time=v=>{__seek=v};
window.__loop=LOOP;
function frame(now){
  if(__seek!=null)now=__seek;
  const t=now%LOOP,b=t/LOOP;
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle=rgba(PAL.text,0.03);ctx.lineWidth=1;
  for(let x=0;x<W;x+=W/20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=H/12){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // title (always visible, subtle pulse)
  const titleA=0.85+0.15*Math.sin(t/2000);
  ctx.font=`bold ${W*0.028}px system-ui`;ctx.fillStyle=rgba(PAL.text,titleA);ctx.textAlign='center';
  ctx.fillText('Token Bucket Rate Limiter',W*0.5,H*0.08);
  // beat label with seam-safe Refill
  const labels=['Refill','Steady','Burst','Throttle'];
  const bi=b<0.2?0:b<0.467?1:b<0.733?2:b<0.933?3:4;
  let la=0,ltxt='';
  if(bi===0){la=ease(clamp01((6000-t)/500));ltxt='Refill'}
  else if(bi===1){la=fade(t,6000,14000,0.15);ltxt='Steady'}
  else if(bi===2){la=fade(t,14000,22000,0.15);ltxt='Burst'}
  else if(bi===3){la=fade(t,22000,28000,0.15);ltxt='Throttle'}
  else{la=ease(clamp01((t-28000)/500));ltxt='Refill'}
  ctx.font=`${W*0.018}px system-ui`;ctx.fillStyle=rgba(PAL.accent,la);
  ctx.fillText(ltxt.toUpperCase(),W*0.5,H*0.13);
  // bucket
  const fl=fillLevel(t),bx=bucket.x,by=bucket.y,bw=bucket.w,bh=bucket.h;
  ctx.strokeStyle=rgba(PAL.text,0.3);ctx.lineWidth=2;
  ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.stroke();
  const fh=bh*fl;
  if(fh>1){const g=ctx.createLinearGradient(0,by+bh-fh,0,by+bh);g.addColorStop(0,rgba(PAL.accent,0.6));g.addColorStop(1,rgba(PAL.accent,0.2));ctx.fillStyle=g;ctx.fillRect(bx+2,by+bh-fh,bw-4,fh-2)}
  ctx.font=`${W*0.012}px system-ui`;ctx.fillStyle=rgba(PAL.muted,0.8);ctx.textAlign='center';
  ctx.fillText(`${Math.round(fl*100)}%`,bx+bw/2,by+bh+W*0.03);
  // refill drip
  const dripA=0.4+0.3*Math.sin(t/300);
  ctx.fillStyle=rgba(PAL.accent,dripA);
  ctx.beginPath();ctx.arc(bx+bw/2,by-W*0.02,W*0.006,0,Math.PI*2);ctx.fill();
  // source nodes
  srcs.forEach((s,i)=>{
    const pulse=1+0.15*Math.sin(t/400+i*2);
    ctx.fillStyle=rgba(PAL.muted,0.5);ctx.beginPath();ctx.arc(s.x,s.y,s.r*pulse,0,Math.PI*2);ctx.fill();
    ctx.font=`${W*0.01}px system-ui`;ctx.fillStyle=rgba(PAL.muted,0.6);ctx.textAlign='center';
    ctx.fillText(`req ${i+1}`,s.x,s.y+s.r*1.8);
  });
  // packets
  const spawns=getSpawns(t);
  spawns.forEach(sp=>{
    const p=clamp01((t-sp.t0)/sp.dur),pe=ease(p);
    const s=srcs[sp.src],target={x:bx+bw/2,y:by+bh/2};
    const ctrl={x:(s.x+target.x)/2,y:s.y-H*0.08};
    const pos=quad(s,ctrl,target,pe);
    const col=sp.ok?PAL.accent:PAL.fail;
    const a=sp.ok?1-pe*0.3:1-pe*0.8;
    for(let i=1;i<=4;i++){const tt=clamp01(pe-i*0.04);if(tt<=0)continue;const tp=quad(s,ctrl,target,tt);ctx.fillStyle=rgba(col,a*0.15*(1-i*0.2));ctx.beginPath();ctx.arc(tp.x,tp.y,W*0.004,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle=rgba(col,a);ctx.beginPath();ctx.arc(pos.x,pos.y,W*0.007,0,Math.PI*2);ctx.fill();
    if(!sp.ok&&p>0.7){ctx.font=`${W*0.01}px system-ui`;ctx.fillStyle=rgba(PAL.fail,(p-0.7)/0.3);ctx.textAlign='center';ctx.fillText('429',pos.x,pos.y-W*0.015)}
  });
  // meter
  const mx=meter.x,my=meter.y,mw=meter.w,mh=meter.h;
  const mLevel=bi===2?0.9:bi===3?0.2:fl;
  ctx.strokeStyle=rgba(PAL.text,0.2);ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
  const mh2=mh*mLevel;
  ctx.fillStyle=rgba(bi===3?PAL.fail:PAL.accent,0.5);ctx.fillRect(mx,my+mh-mh2,mw,mh2);
  ctx.font=`${W*0.01}px system-ui`;ctx.fillStyle=rgba(PAL.muted,0.7);ctx.textAlign='center';
  ctx.fillText('throughput',mx+mw/2,my+mh+W*0.03);
  // counter
  const cnt=acceptedCount(t);
  ctx.font=`bold ${W*0.022}px system-ui`;ctx.fillStyle=rgba(PAL.accent,0.9);ctx.textAlign='right';
  ctx.fillText(`${cnt}`,W*0.92,H*0.18);
  ctx.font=`${W*0.01}px system-ui`;ctx.fillStyle=rgba(PAL.muted,0.6);
  ctx.fillText('accepted',W*0.92,H*0.22);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
