<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>*{margin:0;padding:0}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=30000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr;
function buildLayout(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
const lerp=(a,b,t)=>a+(b-a)*t,clamp01=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const fade=(t,a,b)=>{const d=b-a;return t<a||t>=b?0:t<a+.12*d?ease((t-a)/(.12*d)):t>b-.12*d?ease((b-t)/(.12*d)):1};
const quad=(a,c,b,t)=>(1-t)*(1-t)*a+2*(1-t)*t*c+t*t*b;
const BUF=[[0,.2],[.167,.2],[.333,.7],[.5,.95],[.667,.3],[.833,.5],[1,.2]];
function bufLevel(b){for(let i=0;i<BUF.length-1;i++)if(b>=BUF[i][0]&&b<BUF[i+1][0]){const f=(b-BUF[i][0])/(BUF[i+1][0]-BUF[i][0]);return lerp(BUF[i][1],BUF[i+1][1],ease(f))}return .2}
const nodes=[{x:.15,y:.5,label:'Producer',r:28},{x:.5,y:.5,label:'Buffer',r:32},{x:.85,y:.5,label:'Consumer',r:28}];
const STATUS=[{a:0,b:.167,txt:'Steady Flow'},{a:.167,b:.333,txt:'Consumer Slows'},{a:.333,b:.5,txt:'Backpressure Active'},{a:.5,b:.667,txt:'Draining'},{a:.667,b:.833,txt:'Burst Recovery'},{a:.833,b:1,txt:'Balanced'}];
function getPackets(t){
  const b=t/LOOP,N=10,DUR=3000,arr=[];
  const bp=fade(b,.3,.55),thresh=lerp(1,.4,bp);
  for(let i=0;i<N;i++){
    const p=((t/DUR+i/N)%1);
    const a=i/N>thresh?0:1-p*.3;
    if(a<=0)continue;
    const seg=p<.5?0:1,sp=seg===0?p*2:(p-.5)*2,e=ease(sp);
    const ax=nodes[seg].x*W,ay=nodes[seg].y*H,bx=nodes[seg+1].x*W,by=nodes[seg+1].y*H;
    const cx=(ax+bx)/2,cy=ay-H*.12;
    arr.push({x:quad(ax,cx,bx,e),y:quad(ay,cy,by,e),a,c:PAL.accent});
  }
  if(bp>0)for(let i=0;i<3;i++){
    const p=((t/2500+i/3)%1),a=bp*(1-p*.4);
    const e=ease(p),ax=nodes[2].x*W,ay=nodes[2].y*H,bx=nodes[0].x*W,by=nodes[0].y*H;
    const cx=(ax+bx)/2,cy=ay+H*.15;
    arr.push({x:quad(ax,cx,bx,e),y:quad(ay,cy,by,e),a,c:PAL.fail});
  }
  return arr;
}
function drawBg(){ctx.fillStyle=rgba(PAL.bg,1);ctx.fillRect(0,0,W,H);ctx.strokeStyle=rgba(PAL.text,.03);ctx.lineWidth=1;const gs=60;for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawConnections(t){
  const b=t/LOOP;ctx.lineWidth=1.5;
  ctx.strokeStyle=rgba(PAL.accent,.15);ctx.beginPath();
  ctx.moveTo(nodes[0].x*W,nodes[0].y*H);ctx.quadraticCurveTo(W*.325,H*.38,nodes[1].x*W,nodes[1].y*H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(nodes[1].x*W,nodes[1].y*H);ctx.quadraticCurveTo(W*.675,H*.38,nodes[2].x*W,nodes[2].y*H);ctx.stroke();
  const bpA=fade(b,.3,.55)*.3;
  if(bpA>0){ctx.strokeStyle=rgba(PAL.fail,bpA);ctx.beginPath();ctx.moveTo(nodes[2].x*W,nodes[2].y*H);ctx.quadraticCurveTo(W*.5,H*.68,nodes[0].x*W,nodes[0].y*H);ctx.stroke()}
}
function drawNodes(t){
  const b=t/LOOP,bl=bufLevel(b);
  nodes.forEach((n,i)=>{
    const pulse=1+Math.sin(t/400+i*2)*.06,r=n.r*pulse,x=n.x*W,y=n.y*H;
    const col=i===1&&bl>.7?PAL.fail:PAL.accent;
    const g=ctx.createRadialGradient(x,y,r*.3,x,y,r*2.5);
    g.addColorStop(0,rgba(col,.15));g.addColorStop(1,rgba(col,0));
    ctx.fillStyle=g;ctx.fillRect(x-r*3,y-r*3,r*6,r*6);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=rgba(PAL.bg,1);ctx.fill();
    ctx.strokeStyle=rgba(col,.6);ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=rgba(PAL.text,.85);ctx.font=`600 ${Math.round(H*.022)}px system-ui`;
    ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(n.label,x,y+r+10);
  });
  const mx=nodes[1].x*W,my=nodes[1].y*H,mr=nodes[1].r,mh=H*.25,mw=14,mx2=mx+mr+20,my2=my-mh/2;
  ctx.fillStyle=rgba(PAL.text,.08);ctx.fillRect(mx2,my2,mw,mh);
  const fc=bl>.7?PAL.fail:PAL.accent;
  ctx.fillStyle=rgba(fc,.7);ctx.fillRect(mx2,my2+mh*(1-bl),mw,mh*bl);
  ctx.strokeStyle=rgba(PAL.text,.2);ctx.lineWidth=1;ctx.strokeRect(mx2,my2,mw,mh);
  ctx.fillStyle=rgba(fc,.9);ctx.font=`700 ${Math.round(H*.02)}px system-ui`;
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(Math.round(bl*100)+'%',mx2+mw+8,my);
}
function drawEntities(t){getPackets(t).forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=rgba(p.c,p.a);ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fillStyle=rgba(p.c,p.a*.2);ctx.fill()})}
function drawHud(t){
  const b=t/LOOP;let st=STATUS[0];
  for(const s of STATUS)if(b>=s.a&&b<s.b)st=s;
  const a=fade(b,st.a,st.b);
  ctx.fillStyle=rgba(PAL.text,a*.9);ctx.font=`700 ${Math.round(H*.035)}px system-ui`;
  ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(st.txt,W*.5,H*.06);
  const tp=Math.round(lerp(1200,400,bufLevel(b)));
  ctx.fillStyle=rgba(PAL.muted,.7);ctx.font=`500 ${Math.round(H*.018)}px system-ui`;
  ctx.fillText(tp+' msg/s',W*.5,H*.11);
  ctx.fillStyle=rgba(PAL.muted,.4);ctx.font=`400 ${Math.round(H*.014)}px system-ui`;
  ctx.fillText('producer throttles when buffer exceeds 70%',W*.5,H*.92);
}
let __seek=null;
window.__time=(v)=>{__seek=v};
window.__loop=LOOP;
function frame(now){
  if(__seek!=null)now=__seek;
  const t=now%LOOP;
  drawBg();drawConnections(t);drawNodes(t);drawEntities(t);drawHud(t);
  requestAnimationFrame(frame);
}
buildLayout();
addEventListener('resize',buildLayout);
requestAnimationFrame(frame);
</script>
</body>
</html>
