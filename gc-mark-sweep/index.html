<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GC Mark and Sweep</title>
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById("stage");
var ctx=canvas.getContext("2d");
var W=0,H=0,dpr=1;

var LOOP=30000;
var PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
function rgba(c,a){return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}

function lerp(a,b,t){return a+(b-a)*t;}
function clamp01(v){return v<0?0:v>1?1:v;}
function easeInOut(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function easeOut(t){return 1-(1-t)*(1-t);}

function fade(t,start,end,fw){
  if(t<start||t>=end)return 0;
  var a=clamp01((t-start)/fw);
  var b=clamp01((end-t)/fw);
  return Math.min(a,b);
}

var nodes=[];
var edges=[];
var markOrder=[];
var garbageIds=["obj6","obj7"];

function buildLayout(){
  nodes=[
    {id:"rootA",label:"Root A",x:W*0.28,y:H*0.16,type:"root"},
    {id:"rootB",label:"Root B",x:W*0.72,y:H*0.16,type:"root"},
    {id:"obj1",label:"Obj 1",x:W*0.15,y:H*0.44,type:"obj"},
    {id:"obj2",label:"Obj 2",x:W*0.38,y:H*0.44,type:"obj"},
    {id:"obj3",label:"Obj 3",x:W*0.22,y:H*0.70,type:"obj"},
    {id:"obj4",label:"Obj 4",x:W*0.62,y:H*0.44,type:"obj"},
    {id:"obj5",label:"Obj 5",x:W*0.78,y:H*0.70,type:"obj"},
    {id:"obj6",label:"Obj 6",x:W*0.44,y:H*0.64,type:"obj"},
    {id:"obj7",label:"Obj 7",x:W*0.56,y:H*0.82,type:"obj"}
  ];
  edges=[
    {from:"rootA",to:"obj1"},
    {from:"rootA",to:"obj2"},
    {from:"obj1",to:"obj3"},
    {from:"rootB",to:"obj4"},
    {from:"obj4",to:"obj5"},
    {from:"obj6",to:"obj7"}
  ];
  markOrder=[
    {from:"rootA",to:"obj1",t0:3000,t1:4500},
    {from:"rootA",to:"obj2",t0:4500,t1:6000},
    {from:"obj1",to:"obj3",t0:6000,t1:7500},
    {from:"rootB",to:"obj4",t0:7500,t1:9000},
    {from:"obj4",to:"obj5",t0:9000,t1:10500}
  ];
}

function getNode(id){
  for(var i=0;i<nodes.length;i++){if(nodes[i].id===id)return nodes[i];}
  return null;
}

function edgeCurve(e){
  var a=getNode(e.from),b=getNode(e.to);
  var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  var dx=b.x-a.x,dy=b.y-a.y;
  var len=Math.sqrt(dx*dx+dy*dy)||1;
  var nx=-dy/len,ny=dx/len;
  var off=len*0.15;
  return{a:a,b:b,cx:mx+nx*off,cy:my+ny*off};
}

function quad(a,cx,cy,b,t){
  var u=1-t;
  return{
    x:u*u*a.x+2*u*t*cx+t*t*b.x,
    y:u*u*a.y+2*u*t*cy+t*t*b.y
  };
}

function drawBackground(t){
  ctx.fillStyle=rgba(PAL.bg,1);
  ctx.fillRect(0,0,W,H);
  var gs=Math.max(40,W/25);
  ctx.strokeStyle=rgba(PAL.text,0.03);
  ctx.lineWidth=1;
  ctx.beginPath();
  for(var x=0;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(var y=0;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
}

function drawConnections(t){
  for(var i=0;i<edges.length;i++){
    var e=edges[i];
    var a=getNode(e.from),b=getNode(e.to);
    var curve=edgeCurve(e);
    var col=PAL.muted;
    var alpha=0.15;

    var markIdx=-1;
    for(var m=0;m<markOrder.length;m++){
      if(markOrder[m].from===e.from&&markOrder[m].to===e.to){markIdx=m;break;}
    }
    if(markIdx>=0){
      var mo=markOrder[markIdx];
      if(t>=mo.t1){col=PAL.accent;alpha=0.35;}
      else if(t>=mo.t0){col=PAL.accent;alpha=0.5;}
    }
    if(e.from==="obj6"&&e.to==="obj7"){
      if(t>=15000&&t<25000){col=PAL.fail;alpha=0.3;}
    }
    ctx.strokeStyle=rgba(col,alpha);
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(curve.cx,curve.cy,b.x,b.y);
    ctx.stroke();
  }
}

function drawNodes(t){
  var baseR=Math.min(W,H)*0.035;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    var pulse=1+0.06*Math.sin(t/400+i*1.3);
    var r=baseR*pulse;
    var alpha=1;
    var col=PAL.muted;
    var isRoot=n.type==="root";
    var isGarbage=garbageIds.indexOf(n.id)!==-1;
    var marked=false;
    for(var m=0;m<markOrder.length;m++){
      if(markOrder[m].to===n.id&&t>=markOrder[m].t1)marked=true;
    }

    if(isRoot){col=PAL.accent;}
    else if(marked){col=PAL.accent;}
    else if(isGarbage){
      if(t>=15000&&t<25000){
        var sweepT=(t-15000)/10000;
        if(sweepT<0.3){col=PAL.fail;}
        else if(sweepT<0.7){
          var shrink=1-easeInOut((sweepT-0.3)/0.4);
          r*=shrink;alpha*=shrink;col=PAL.fail;
        }else{
          var fo=1-easeInOut((sweepT-0.7)/0.3);
          r*=fo;alpha*=fo;col=PAL.fail;
        }
      }else if(t>=25000){
        var reappear=easeOut(clamp01((t-25000)/2000));
        r*=reappear;alpha*=reappear;col=PAL.muted;
      }
    }
    if(r<1||alpha<0.01)continue;

    var glow=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.5);
    glow.addColorStop(0,rgba(col,0.15*alpha));
    glow.addColorStop(1,rgba(col,0));
    ctx.fillStyle=glow;
    ctx.beginPath();
    ctx.arc(n.x,n.y,r*2.5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=rgba(col,0.2*alpha);
    ctx.beginPath();
    ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=rgba(col,0.8*alpha);
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.stroke();

    if(isRoot){
      ctx.fillStyle=rgba(col,0.9*alpha);
      ctx.font="bold "+Math.round(r*0.55)+"px monospace";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText("R",n.x,n.y);
    }
    ctx.fillStyle=rgba(PAL.text,0.85*alpha);
    ctx.font=Math.round(r*0.5)+"px monospace";
    ctx.textAlign="center";
    ctx.textBaseline="top";
    ctx.fillText(n.label,n.x,n.y+r+6);
  }
}

function drawEntities(t){
  for(var i=0;i<markOrder.length;i++){
    var mo=markOrder[i];
    if(t<mo.t0||t>=mo.t1)continue;
    var p=(t-mo.t0)/(mo.t1-mo.t0);
    var a=getNode(mo.from),b=getNode(mo.to);
    var curve=edgeCurve({from:mo.from,to:mo.to});
    var pos=quad(a,curve.cx,curve.cy,b,easeInOut(p));
    var trailLen=0.12;
    for(var tr=trailLen;tr>0;tr-=0.02){
      var tp=clamp01(p-tr);
      if(tp<0)continue;
      var tpos=quad(a,curve.cx,curve.cy,b,easeInOut(tp));
      var ta=(1-tr/trailLen)*0.5;
      ctx.fillStyle=rgba(PAL.accent,ta);
      ctx.beginPath();
      ctx.arc(tpos.x,tpos.y,3*(1-tr/trailLen),0,Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle=rgba(PAL.accent,0.9);
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,5,0,Math.PI*2);
    ctx.fill();
    var pg=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,15);
    pg.addColorStop(0,rgba(PAL.accent,0.4));
    pg.addColorStop(1,rgba(PAL.accent,0));
    ctx.fillStyle=pg;
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,15,0,Math.PI*2);
    ctx.fill();
  }

  if(t>=15000&&t<25000){
    var sweepT=(t-15000)/10000;
    for(var g=0;g<garbageIds.length;g++){
      var gn=getNode(garbageIds[g]);
      if(!gn)continue;
      var gt=clamp01((sweepT-g*0.15)/0.3);
      if(gt>0&&gt<1){
        var ring=gt*40;
        var ra=(1-gt)*0.5;
        ctx.strokeStyle=rgba(PAL.fail,ra);
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.arc(gn.x,gn.y,Math.min(W,H)*0.035+ring,0,Math.PI*2);
        ctx.stroke();
      }
    }
  }
}

function drawHud(t){
  var titleAlpha=fade(t,200,3000,800);
  if(titleAlpha>0){
    ctx.fillStyle=rgba(PAL.text,titleAlpha);
    ctx.font="bold "+Math.round(Math.min(W,H)*0.045)+"px monospace";
    ctx.textAlign="center";
    ctx.textBaseline="top";
    ctx.fillText("GC Mark and Sweep",W*0.5,H*0.03);
  }

  var phaseLabel="";
  var phaseAlpha=0;
  var phaseCol=PAL.accent;
  if(t>=3000&&t<12000){phaseLabel="MARK";phaseAlpha=fade(t,3000,12000,600);phaseCol=PAL.accent;}
  else if(t>=12000&&t<15000){phaseLabel="MARKED";phaseAlpha=fade(t,12000,15000,400);phaseCol=PAL.accent;}
  else if(t>=15000&&t<25000){phaseLabel="SWEEP";phaseAlpha=fade(t,15000,25000,600);phaseCol=PAL.fail;}
  else if(t>=25000&&t<30000){phaseLabel="COMPACT";phaseAlpha=fade(t,25000,30000,1000);phaseCol=PAL.accent;}
  if(phaseAlpha>0&&phaseLabel){
    ctx.fillStyle=rgba(phaseCol,phaseAlpha);
    ctx.font="bold "+Math.round(Math.min(W,H)*0.03)+"px monospace";
    ctx.textAlign="center";
    ctx.textBaseline="top";
    ctx.fillText(phaseLabel,W*0.5,H*0.08);
  }

  var barX=W*0.3,barW=W*0.4,barY=H*0.92,barH=6;
  ctx.fillStyle=rgba(PAL.text,0.08);
  ctx.fillRect(barX,barY,barW,barH);
  var barFill=0;
  var barCol=PAL.accent;
  if(t>=3000&&t<12000){barFill=easeInOut((t-3000)/9000);barCol=PAL.accent;}
  else if(t>=12000&&t<15000){barFill=1;barCol=PAL.accent;}
  else if(t>=15000&&t<25000){barFill=1-easeInOut((t-15000)/10000);barCol=PAL.fail;}
  else if(t>=25000){barFill=0;}
  if(barFill>0){
    ctx.fillStyle=rgba(barCol,0.7);
    ctx.fillRect(barX,barY,barW*barFill,barH);
  }

  var counterText="";
  var counterAlpha=0;
  if(t>=3000&&t<12000){
    var marked=0;
    for(var m=0;m<markOrder.length;m++){
      if(t>=markOrder[m].t1)marked++;
    }
    counterText=marked+" / 7 marked";
    counterAlpha=fade(t,3000,12000,500);
  }else if(t>=12000&&t<15000){
    counterText="5 / 7 marked";
    counterAlpha=fade(t,12000,15000,400);
  }else if(t>=15000&&t<25000){
    var collected=0;
    if(t>=17000)collected=1;
    if(t>=19000)collected=2;
    counterText="Collected: "+collected+" / 2";
    counterAlpha=fade(t,15000,25000,500);
  }
  if(counterAlpha>0&&counterText){
    ctx.fillStyle=rgba(PAL.text,counterAlpha);
    ctx.font=Math.round(Math.min(W,H)*0.022)+"px monospace";
    ctx.textAlign="center";
    ctx.textBaseline="top";
    ctx.fillText(counterText,W*0.5,barY+14);
  }

  if(t>=25000&&t<30000){
    var fa=fade(t,25500,29500,800);
    if(fa>0){
      ctx.fillStyle=rgba(PAL.accent,fa);
      ctx.font="bold "+Math.round(Math.min(W,H)*0.028)+"px monospace";
      ctx.textAlign="center";
      ctx.textBaseline="top";
      ctx.fillText("Heap Compacted",W*0.5,H*0.88);
    }
  }
}

var __seek=null;
window.__time=function(v){__seek=v;};
window.__loop=LOOP;

function frame(now){
  if(__seek!=null)now=__seek;
  var t=now%LOOP;
  ctx.clearRect(0,0,W,H);
  drawBackground(t);
  drawConnections(t);
  drawNodes(t);
  drawEntities(t);
  drawHud(t);
  requestAnimationFrame(frame);
}

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildLayout();
}

window.addEventListener("resize",resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
