<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// setup
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=30000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr,roots,nodes,edges,markPkts;

// layout
function buildLayout(){
roots=[{x:W*.35,y:H*.14,label:'Root A'},{x:W*.65,y:H*.14,label:'Root B'}];
nodes=[
{x:W*.22,y:H*.40,label:'obj 1',r:1},{x:W*.50,y:H*.40,label:'obj 2',r:1},
{x:W*.78,y:H*.40,label:'obj 3',r:1},{x:W*.35,y:H*.64,label:'obj 4',r:1},
{x:W*.65,y:H*.64,label:'obj 5',r:1},{x:W*.18,y:H*.84,label:'obj 6',r:0},
{x:W*.82,y:H*.84,label:'obj 7',r:0}];
edges=[
{a:roots[0],b:nodes[0]},{a:roots[0],b:nodes[1]},
{a:roots[1],b:nodes[2]},{a:roots[1],b:nodes[3]},
{a:nodes[2],b:nodes[4]}];
markPkts=[
{a:roots[0],b:nodes[0],s:3000,d:1200},
{a:roots[0],b:nodes[1],s:4800,d:1200},
{a:roots[1],b:nodes[2],s:4800,d:1200},
{a:roots[1],b:nodes[3],s:6600,d:1200},
{a:nodes[2],b:nodes[4],s:6600,d:1200}];
}

// easing
const lerp=(a,b,t)=>a+(b-a)*t,clamp01=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const quad=(a,c,b,t)=>({x:lerp(lerp(a.x,c.x,t),lerp(c.x,b.x,t),t),y:lerp(lerp(a.y,c.y,t),lerp(c.y,b.y,t),t)});

// hooks
let __seek=null;
window.__time=v=>{__seek=v};
window.__loop=LOOP;

// frame
function frame(now){
if(__seek!=null)now=__seek;
const t=now%LOOP;
ctx.clearRect(0,0,W,H);
drawBg(t);drawEdges(t);drawNodes(t);drawPkts(t);drawHud(t);
requestAnimationFrame(frame);
}

function drawBg(t){
ctx.fillStyle=rgba(PAL.bg,1);ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
const s=W/20;
for(let x=0;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=0;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}

function drawEdges(t){
ctx.lineWidth=1.5;
edges.forEach(e=>{
const m={x:(e.a.x+e.b.x)/2,y:(e.a.y+e.b.y)/2-H*.06};
ctx.strokeStyle=rgba(PAL.muted,.2);
ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.quadraticCurveTo(m.x,m.y,e.b.x,e.b.y);ctx.stroke();
});
}

function drawNodes(t){
const r=Math.min(W,H)*.035,pulse=Math.sin(t/400)*.08+1;
roots.forEach(n=>{
ctx.beginPath();ctx.arc(n.x,n.y,r*.8*pulse,0,Math.PI*2);
ctx.fillStyle=rgba(PAL.accent,.3);ctx.fill();
ctx.strokeStyle=rgba(PAL.accent,.8);ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle=rgba(PAL.text,.9);ctx.font=`${Math.min(W,H)*.018}px monospace`;ctx.textAlign='center';
ctx.fillText(n.label,n.x,n.y-r*1.4);
});
nodes.forEach((n,i)=>{
const markT=3000+i*1800;
const marked=n.r===1&&t>markT;
const sweepOut=n.r===0?clamp01((t-(15000+i*800))/1200):0;
const sweepIn=n.r===0?clamp01((t-(28000+i*800))/1200):1;
const vis=n.r===0?1-ease(sweepOut)+ease(sweepIn):1;
const scale=n.r===0?lerp(1,.3,ease(sweepOut))*lerp(.3,1,ease(sweepIn)):1;
const alpha=n.r===0?lerp(1,.15,ease(sweepOut))*lerp(.15,1,ease(sweepIn)):1;
if(alpha<.01)return;
const col=marked?PAL.accent:(n.r===0&&sweepOut>.5&&sweepIn<.5?PAL.fail:PAL.muted);
if(marked){const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.5);g.addColorStop(0,rgba(PAL.accent,.15*alpha));g.addColorStop(1,rgba(PAL.accent,0));ctx.fillStyle=g;ctx.fillRect(n.x-r*3,n.y-r*3,r*6,r*6)}
ctx.beginPath();ctx.arc(n.x,n.y,r*pulse*scale,0,Math.PI*2);
ctx.fillStyle=rgba(col,.2*alpha);ctx.fill();
ctx.strokeStyle=rgba(col,.9*alpha);ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle=rgba(PAL.text,alpha);ctx.font=`${Math.min(W,H)*.016}px monospace`;ctx.textAlign='center';
ctx.fillText(n.label,n.x,n.y+r*1.5*scale);
});
}

function drawPkts(t){
const r=Math.min(W,H)*.012;
markPkts.forEach(p=>{
const pr=(t-p.s)/p.d;
if(pr<0||pr>1)return;
const m={x:(p.a.x+p.b.x)/2,y:(p.a.y+p.b.y)/2-H*.08};
for(let i=4;i>=0;i--){
const tp=pr-i*.04;if(tp<0)continue;
const pp=quad(p.a,m,p.b,ease(tp));
ctx.beginPath();ctx.arc(pp.x,pp.y,r*(1-i*.15),0,Math.PI*2);
ctx.fillStyle=rgba(PAL.accent,(1-i*.18)*(1-pr*.3));ctx.fill();
}
});
}

function drawHud(t){
const fs=Math.min(W,H)*.028;
ctx.font=`bold ${fs}px monospace`;ctx.textAlign='center';
const markA=clamp01((t-2000)/1000)*clamp01((14000-t)/1000);
const sweepA=clamp01((t-14000)/1000)*clamp01((22000-t)/1000);
if(markA>0){ctx.fillStyle=rgba(PAL.accent,markA);ctx.fillText('MARK',W*.5,H*.05)}
if(sweepA>0){ctx.fillStyle=rgba(PAL.fail,sweepA);ctx.fillText('SWEEP',W*.5,H*.05)}
const mx=W*.3,mw=W*.4,my=H*.94,mh=H*.02;
const used=t<15000?1:lerp(1,.55,ease(clamp01((t-15000)/6000)));
ctx.fillStyle=rgba(PAL.muted,.2);ctx.fillRect(mx,my,mw,mh);
ctx.fillStyle=rgba(t<15000?PAL.accent:PAL.fail,.7);ctx.fillRect(mx,my,mw*used,mh);
ctx.fillStyle=rgba(PAL.text,.6);ctx.font=`${fs*.6}px monospace`;
ctx.fillText(`heap ${Math.round(used*100)}%`,W*.5,my-mh*.8);
const marked=nodes.filter((n,i)=>n.r===1&&t>3000+i*1800).length;
const freed=nodes.filter((n,i)=>n.r===0&&t>15000+i*800).length;
ctx.fillStyle=rgba(PAL.text,.5);ctx.font=`${fs*.55}px monospace`;
ctx.textAlign='left';ctx.fillText(`marked: ${marked}`,mx,my+mh*2.5);
ctx.textAlign='right';ctx.fillText(`freed: ${freed}`,mx+mw,my+mh*2.5);
}

// resize
function resize(){
dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
ctx.setTransform(dpr,0,0,dpr,0,0);buildLayout();
}
window.addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
