<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// setup
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=30000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr,roots,nodes,edges;

// layout
function buildLayout(){
roots=[{x:W*.35,y:H*.12,label:'Root A'},{x:W*.65,y:H*.12,label:'Root B'}];
nodes=[
{x:W*.22,y:H*.38,label:'obj 1',r:1},{x:W*.5,y:H*.38,label:'obj 2',r:1},
{x:W*.78,y:H*.38,label:'obj 3',r:1},{x:W*.35,y:H*.62,label:'obj 4',r:1},
{x:W*.65,y:H*.62,label:'obj 5',r:1},{x:W*.18,y:H*.82,label:'obj 6',r:0},
{x:W*.82,y:H*.82,label:'obj 7',r:0}];
edges=[{f:0,t:0},{f:0,t:1},{f:1,t:2},{f:1,t:3},{f:2,t:4}];
}

// easing
const lerp=(a,b,t)=>a+(b-a)*t,clamp01=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const quad=(a,c,b,t)=>({x:lerp(lerp(a.x,c.x,t),lerp(c.x,b.x,t),t),y:lerp(lerp(a.y,c.y,t),lerp(c.y,b.y,t),t)});
const beat=(t,a,b)=>{const p=(t-a)/(b-a);if(p<0||p>1)return 0;return Math.min(clamp01(p/.15),clamp01((1-p)/.15))};

// hooks
let __seek=null;
window.__time=v=>{__seek=v};
window.__loop=LOOP;

// packets (deterministic spawn windows)
const markPkts=[
{f:roots[0],t:nodes[0],s:3000,d:1200},{f:roots[0],t:nodes[1],s:4800,d:1200},
{f:roots[1],t:nodes[2],s:4800,d:1200},{f:nodes[1],t:nodes[3],s:6600,d:1200},
{f:nodes[2],t:nodes[4],s:6600,d:1200}];
const markTimes=[3000,4800,4800,6600,6600];

// frame
function frame(now){
if(__seek!=null)now=__seek;
const t=now%LOOP;
ctx.clearRect(0,0,W,H);
drawBg(t);drawEdges(t);drawNodes(t);drawPkts(t);drawHud(t);
requestAnimationFrame(frame);
}

function drawBg(t){
ctx.fillStyle=rgba(PAL.bg,1);ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
const s=W/20;
for(let x=0;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=0;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}

function drawEdges(t){
const a=beat(t,2000,15500);
ctx.lineWidth=1.5;
edges.forEach(e=>{
const A=roots[e.f],B=nodes[e.t],m={x:(A.x+B.x)/2,y:(A.y+B.y)/2-H*.06};
ctx.strokeStyle=rgba(PAL.muted,.12+a*.25);
ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo(m.x,m.y,B.x,B.y);ctx.stroke();
});
}

function drawNodes(t){
const r=Math.min(W,H)*.035,pulse=Math.sin(t/400)*.08+1;
roots.forEach(n=>{
const a=beat(t,500,LOOP-500);
ctx.beginPath();ctx.arc(n.x,n.y,r*.8*pulse,0,Math.PI*2);
ctx.fillStyle=rgba(PAL.accent,.3*a);ctx.fill();
ctx.strokeStyle=rgba(PAL.accent,.8*a);ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle=rgba(PAL.text,a);ctx.font=`${Math.min(W,H)*.018}px monospace`;ctx.textAlign='center';
ctx.fillText(n.label,n.x,n.y-r*1.3);
});
nodes.forEach((n,i)=>{
const appear=beat(t,1000+i*200,LOOP-500);
const mi=markTimes.indexOf(3000+i*1800);
const isMarked=n.r===1;
const markT=isMarked?3000+i*1800:0;
const marked=isMarked&&t>markT;
const sweepT=!isMarked?17000+i*800:0;
const swept=!isMarked&&t>sweepT;
const sp=swept?ease(clamp01((t-sweepT)/1200)):0;
const alpha=appear*(swept?1-sp:1);
if(alpha<=0)return;
const col=marked?PAL.accent:swept?PAL.fail:PAL.muted;
if(marked){const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.5);g.addColorStop(0,rgba(PAL.accent,.2*alpha));g.addColorStop(1,rgba(PAL.accent,0));ctx.fillStyle=g;ctx.fillRect(n.x-r*3,n.y-r*3,r*6,r*6)}
ctx.beginPath();ctx.arc(n.x,n.y,r*pulse*(1-sp),0,Math.PI*2);
ctx.fillStyle=rgba(col,.2*alpha);ctx.fill();
ctx.strokeStyle=rgba(col,.9*alpha);ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle=rgba(PAL.text,alpha);ctx.font=`${Math.min(W,H)*.016}px monospace`;ctx.textAlign='center';
ctx.fillText(n.label,n.x,n.y+r*1.5);
});
}

function drawPkts(t){
const r=Math.min(W,H)*.012;
markPkts.forEach(p=>{
const pr=(t-p.s)/p.d;
if(pr<0||pr>1)return;
const m={x:(p.f.x+p.t.x)/2,y:(p.f.y+p.t.y)/2-H*.08};
const pos=quad(p.f,m,p.t,ease(pr));
for(let i=4;i>=0;i--){
const tp=pr-i*.04;if(tp<0)continue;
const pp=quad(p.f,m,p.t,ease(tp));
ctx.beginPath();ctx.arc(pp.x,pp.y,r*(1-i*.15),0,Math.PI*2);
ctx.fillStyle=rgba(PAL.accent,(1-i*.18)*(1-pr*.4));ctx.fill();
}
});
}

function drawHud(t){
const fs=Math.min(W,H)*.028;
ctx.font=`bold ${fs}px monospace`;ctx.textAlign='center';
const mA=beat(t,2000,15500),sA=beat(t,14500,28000);
if(mA>0){ctx.fillStyle=rgba(PAL.accent,mA);ctx.fillText('MARK',W*.5,H*.06)}
if(sA>0){ctx.fillStyle=rgba(PAL.fail,sA);ctx.fillText('SWEEP',W*.5,H*.06)}
const mx=W*.3,mw=W*.4,my=H*.94,mh=H*.02;
const used=t<16000?1:lerp(1,.55,ease(clamp01((t-16000)/8000)));
ctx.fillStyle=rgba(PAL.muted,.2);ctx.fillRect(mx,my,mw,mh);
ctx.fillStyle=rgba(t<16000?PAL.accent:PAL.fail,.7);ctx.fillRect(mx,my,mw*used,mh);
ctx.fillStyle=rgba(PAL.text,.6);ctx.font=`${fs*.6}px monospace`;
ctx.fillText(`heap ${Math.round(used*100)}%`,W*.5,my-mh*.8);
const marked=nodes.filter((n,i)=>n.r===1&&t>3000+i*1800).length;
const freed=nodes.filter((n,i)=>n.r===0&&t>17000+i*800).length;
ctx.fillStyle=rgba(PAL.text,.5);ctx.font=`${fs*.55}px monospace`;
ctx.textAlign='left';ctx.fillText(`marked: ${marked}`,mx,my+mh*2.5);
ctx.textAlign='right';ctx.fillText(`freed: ${freed}`,mx+mw,my+mh*2.5);
}

// resize
function resize(){
dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
ctx.setTransform(dpr,0,0,dpr,0,0);buildLayout();
}
window.addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
