<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Raft Leader Election</title>
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById("stage");
var ctx=canvas.getContext("2d");
var W=0,H=0,dpr=1;

var LOOP=30000;
var PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9],amber:[251,191,36]};

function rgba(c,a){return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}

function lerp(a,b,t){return a+(b-a)*t;}
function clamp01(v){return v<0?0:v>1?1:v;}
function easeInOut(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function easeOut(t){return 1-(1-t)*(1-t);}

function fade(t,start,end,fadeW){
  if(t<start||t>=end)return 0;
  var a=clamp01((t-start)/fadeW);
  var b=clamp01((end-t)/fadeW);
  return Math.min(a,b);
}

var nodes=[];
function buildLayout(){
  var nx=[W*0.2,W*0.5,W*0.8];
  var ny=H*0.42;
  nodes=[
    {x:nx[0],y:ny,r:Math.min(W,H)*0.055,label:"Node A"},
    {x:nx[1],y:ny,r:Math.min(W,H)*0.055,label:"Node B"},
    {x:nx[2],y:ny,r:Math.min(W,H)*0.055,label:"Node C"}
  ];
}

function quad(a,c,b,t){
  var u=1-t;
  return{x:u*u*a.x+2*u*t*c.x+t*t*b.x, y:u*u*a.y+2*u*t*c.y+t*t*b.y};
}

function drawGrid(){
  ctx.strokeStyle=rgba(PAL.text,0.03);
  ctx.lineWidth=1;
  var step=Math.max(40,W*0.04);
  for(var x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawGlow(x,y,r,col,a){
  var g=ctx.createRadialGradient(x,y,0,x,y,r*2.5);
  g.addColorStop(0,rgba(col,a*0.5));
  g.addColorStop(1,rgba(col,0));
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,r*2.5,0,Math.PI*2);ctx.fill();
}

function drawNode(n,t,beat,role){
  var pulse=1+0.06*Math.sin(t/400+n.x);
  var r=n.r*pulse;
  var col=PAL.muted;
  if(role==="leader")col=PAL.accent;
  else if(role==="dead")col=PAL.fail;
  else if(role==="candidate")col=PAL.amber;

  drawGlow(n.x,n.y,r,col,0.6);

  ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
  ctx.fillStyle=rgba(PAL.bg,0.9);
  ctx.fill();
  ctx.lineWidth=2.5;
  ctx.strokeStyle=rgba(col,0.9);
  ctx.stroke();

  ctx.fillStyle=rgba(col,0.95);
  ctx.font="bold "+Math.round(r*0.55)+"px system-ui,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(n.label.replace("Node ",""),n.x,n.y);
}

function drawTimerArc(n,t,beat,fill,active){
  if(!active)return;
  var r=n.r*1.5;
  var cx=n.x,cy=n.y+r*0.6;
  var startA=Math.PI*0.15;
  var endA=Math.PI*0.85;
  var sweep=(endA-startA)*fill;

  ctx.beginPath();ctx.arc(cx,cy,r,startA,endA);
  ctx.strokeStyle=rgba(PAL.muted,0.2);
  ctx.lineWidth=4;ctx.lineCap="round";ctx.stroke();

  if(fill>0.01){
    ctx.beginPath();ctx.arc(cx,cy,r,startA,startA+sweep);
    ctx.strokeStyle=rgba(PAL.accent,0.8);
    ctx.lineWidth=4;ctx.lineCap="round";ctx.stroke();
  }
}

function drawStatus(n,t,beat,role){
  var labels={leader:"Leader",follower:"Follower",candidate:"Candidate",dead:"Dead"};
  var txt=labels[role]||"Follower";
  var col=PAL.muted;
  if(role==="leader")col=PAL.accent;
  else if(role==="dead")col=PAL.fail;
  else if(role==="candidate")col=PAL.amber;

  ctx.fillStyle=rgba(col,0.9);
  ctx.font="600 "+Math.round(Math.min(W,H)*0.022)+"px system-ui,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText(txt,n.x,n.y+n.r*2.2);
}

function drawPacket(x,y,col,a){
  drawGlow(x,y,6,col,a);
  ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fillStyle=rgba(col,a);ctx.fill();
}

function drawTrail(pts,col,a){
  for(var i=0;i<pts.length;i++){
    var al=a*(i/pts.length)*0.4;
    ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,2.5,0,Math.PI*2);
    ctx.fillStyle=rgba(col,al);ctx.fill();
  }
}

function drawConnections(t,beat){
  var a=nodes[0],b=nodes[1],c=nodes[2];
  var midY=H*0.25;

  // A→B
  var cAB={x:(a.x+b.x)/2,y:midY};
  // A→C
  var cAC={x:(a.x+c.x)/2,y:midY-20};
  // B→C
  var cBC={x:(b.x+c.x)/2,y:midY+10};

  var lineA=0.12;
  if(beat<0.25)lineA=0.25;
  else if(beat<0.5)lineA=0.08;
  else if(beat<0.75)lineA=0.15;
  else lineA=0.25;

  ctx.lineWidth=1.5;
  ctx.strokeStyle=rgba(PAL.muted,lineA);
  ctx.setLineDash([4,6]);

  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cAB.x,cAB.y,b.x,b.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cAC.x,cAC.y,c.x,c.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.quadraticCurveTo(cBC.x,cBC.y,c.x,c.y);ctx.stroke();
  ctx.setLineDash([]);
}

function drawPackets(t,beat){
  var a=nodes[0],b=nodes[1],c=nodes[2];
  var midY=H*0.25;
  var cAB={x:(a.x+b.x)/2,y:midY};
  var cAC={x:(a.x+c.x)/2,y:midY-20};
  var cBC={x:(b.x+c.x)/2,y:midY+10};
  var cCB={x:(c.x+b.x)/2,y:midY+10};

  var DUR=1200;
  var packets=[];

  if(beat<0.25||beat>=0.8){
    // Heartbeat: A→B, A→C
    var hb=(beat<0.25?beat:beat-0.8)/0.25;
    var nPackets=3;
    for(var i=0;i<nPackets;i++){
      var pt=((hb*3+i*0.33)%1+1)%1;
      var pe=easeInOut(pt);
      var posAB=quad(a,cAB,b,pe);
      var posAC=quad(a,cAC,c,pe);
      packets.push({x:posAB.x,y:posAB.y,col:PAL.accent,a:0.9*(1-Math.abs(pt-0.5)*0.5)});
      packets.push({x:posAC.x,y:posAC.y,col:PAL.accent,a:0.9*(1-Math.abs(pt-0.5)*0.5)});
    }
  }

  if(beat>=0.5&&beat<0.75){
    // Vote: B→A (dead, no reply), B→C, C→B (vote yes)
    var vb=(beat-0.5)/0.25;
    var nV=2;
    for(var j=0;j<nV;j++){
      var vt=((vb*2+j*0.5)%1+1)%1;
      var ve=easeInOut(vt);
      var posBA=quad(b,cAB,a,ve);
      var posBC=quad(b,cBC,c,ve);
      packets.push({x:posBA.x,y:posBA.y,col:PAL.amber,a:0.7*(1-Math.abs(vt-0.5)*0.4)});
      packets.push({x:posBC.x,y:posBC.y,col:PAL.amber,a:0.9*(1-Math.abs(vt-0.5)*0.4)});
    }
    // C→B vote reply (only after 50% of vote beat)
    if(vb>0.4){
      var rt=((vb-0.4)/0.6)%1;
      var re=easeInOut(rt);
      var posCB=quad(c,cCB,b,re);
      packets.push({x:posCB.x,y:posCB.y,col:PAL.accent,a:0.9*(1-Math.abs(rt-0.5)*0.3)});
    }
  }

  if(beat>=0.75&&beat<0.8){
    // Commit: B→C heartbeat starts
    var cb=(beat-0.75)/0.05;
    var ct=cb%1;
    var ce=easeInOut(ct);
    var posB2C=quad(b,cBC,c,ce);
    packets.push({x:posB2C.x,y:posB2C.y,col:PAL.accent,a:0.8});
  }

  for(var k=0;k<packets.length;k++){
    drawPacket(packets[k].x,packets[k].y,packets[k].col,packets[k].a);
  }
}

function drawTitle(t,beat){
  var titles=["Heartbeat","Timeout","Vote Request","Leader Committed","Heartbeat"];
  var idx;
  if(beat<0.25)idx=0;
  else if(beat<0.5)idx=1;
  else if(beat<0.75)idx=2;
  else idx=3;

  var fadeW=0.04;
  var al=1;
  var beatStart=idx*0.25;
  var beatEnd=beatStart+0.25;
  if(beat<beatStart+fadeW)al=clamp01((beat-beatStart)/fadeW);
  if(beat>beatEnd-fadeW)al=clamp01((beatEnd-beat)/fadeW);

  // For the last beat (idx=3, 0.75-1.0), crossfade to "Heartbeat" at the end
  if(idx===3&&beat>0.92){
    al=clamp01((0.98-beat)/0.06);
  }

  ctx.fillStyle=rgba(PAL.text,al*0.9);
  ctx.font="bold "+Math.round(Math.min(W,H)*0.045)+"px system-ui,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText(titles[idx],W*0.5,H*0.08);

  // Subtitle
  var subs=["Leader sends periodic pings","Election timer expires","Candidate requests votes","Majority reached — new leader"];
  ctx.fillStyle=rgba(PAL.muted,al*0.7);
  ctx.font="400 "+Math.round(Math.min(W,H)*0.02)+"px system-ui,sans-serif";
  ctx.fillText(subs[idx],W*0.5,H*0.14);
}

function drawHud(t,beat){
  // Beat indicator dots
  var dotY=H*0.92;
  var dotR=4;
  var gap=Math.min(W,H)*0.03;
  var startX=W*0.5-gap*1.5;
  for(var i=0;i<4;i++){
    var active=i===Math.min(3,Math.floor(beat*4));
    ctx.beginPath();ctx.arc(startX+i*gap,dotY,dotR,0,Math.PI*2);
    ctx.fillStyle=active?rgba(PAL.accent,0.9):rgba(PAL.muted,0.3);
    ctx.fill();
  }
}

function getRole(nodeIdx,beat){
  // nodeIdx: 0=A, 1=B, 2=C
  if(nodeIdx===0){
    if(beat<0.25)return"leader";
    if(beat<0.5)return"dead";
    return"dead";
  }
  if(nodeIdx===1){
    if(beat<0.25)return"follower";
    if(beat<0.5)return"follower";
    if(beat<0.75)return"candidate";
    return"leader";
  }
  // node C
  if(beat<0.25)return"follower";
  if(beat<0.5)return"follower";
  if(beat<0.75)return"follower";
  return"follower";
}

function getTimerFill(nodeIdx,beat){
  if(nodeIdx===0)return 0;
  if(beat<0.25)return 0;
  if(beat<0.5){
    var f=(beat-0.25)/0.25;
    return nodeIdx===1?easeOut(f):easeOut(f*0.85);
  }
  if(beat<0.75)return 1;
  return 0;
}

function frame(now){
  if(__seek!=null)now=__seek;
  var t=now%LOOP;
  var beat=t/LOOP;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=rgba(PAL.bg,1);
  ctx.fillRect(0,0,W,H);

  drawGrid();
  drawConnections(t,beat);
  drawPackets(t,beat);

  for(var i=0;i<3;i++){
    var role=getRole(i,beat);
    drawNode(nodes[i],t,beat,role);
    var tf=getTimerFill(i,beat);
    var showTimer=(beat>=0.25&&beat<0.75);
    drawTimerArc(nodes[i],t,beat,tf,showTimer);
    drawStatus(nodes[i],t,beat,role);
  }

  drawTitle(t,beat);
  drawHud(t,beat);

  requestAnimationFrame(frame);
}

var __seek=null;
window.__time=function(v){__seek=v;};
window.__loop=LOOP;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildLayout();
}

window.addEventListener("resize",resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
