<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const LOOP=30000;
const PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let W,H,dpr;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const lerp=(a,b,t)=>a+(b-a)*t,clamp01=v=>Math.max(0,Math.min(1,v)),ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const nodes=[{id:'A',x:.2,y:.5},{id:'B',x:.5,y:.5},{id:'C',x:.8,y:.5}];
const np=n=>({x:n.x*W,y:n.y*H});
const beat=(t,a,b)=>{const s=t/LOOP;if(s<a||s>=b)return 0;return Math.min(clamp01((s-a)/.02),clamp01((b-s)/.02))};
const quad=(a,c,b,t)=>{const u=1-t;return{x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y}};
let __seek=null;
window.__time=v=>{__seek=v};
window.__loop=LOOP;
function drawBg(){ctx.fillStyle=rgba(PAL.bg,1);ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;const st=W/20;for(let x=0;x<W;x+=st){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=st){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawConn(){for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){const a=np(nodes[i]),b=np(nodes[j]);ctx.strokeStyle=rgba(PAL.muted,.08);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
function drawNodes(t,s){const r=Math.min(W,H)*.04;nodes.forEach((n,i)=>{const p=np(n),pulse=1+.05*Math.sin(t/400+i*2),rr=r*pulse;let col=PAL.muted;if(i===0)col=s<.25?PAL.accent:s<.5?PAL.fail:PAL.muted;else if(i===1)col=s>=.5?PAL.accent:PAL.muted;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr*2.5);g.addColorStop(0,rgba(col,.25));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rr*2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle=rgba(col,.9);ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.fill();ctx.strokeStyle=rgba(col,.4);ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=rgba(PAL.text,.9);ctx.font=`600 ${Math.min(W,H)*.025}px system-ui`;ctx.textAlign='center';ctx.fillText(n.id,p.x,p.y+rr+Math.min(W,H)*.04)})}
function drawPackets(t,s){const r=Math.min(W,H)*.04;const draw=(a,c,b,off,col,al)=>{for(let k=3;k>=0;k--){const tt=clamp01(off-k*.03);const p=quad(a,c,b,ease(tt));ctx.fillStyle=rgba(col,(1-k*.25)*.6*al);ctx.beginPath();ctx.arc(p.x,p.y,r*.14*(1-k*.1),0,Math.PI*2);ctx.fill()}};
if(s<.25){const a=np(nodes[0]),hb=beat(t,0,LOOP*.25);for(let j=1;j<3;j++){const b=np(nodes[j]),c={x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-r*2};draw(a,c,b,(t%1500)/1500,PAL.accent,hb)}}
if(s>=.5&&s<.75){const b=np(nodes[1]),c=np(nodes[2]),m={x:(b.x+c.x)/2,y:Math.min(b.y,c.y)-r*2};draw(b,m,c,(t%1200)/1200,PAL.accent,1);const o2=clamp01((t%1200)/1200-.5);if(o2>0)draw(c,m,b,o2,PAL.accent,.7)}
if(s>=.75){const b=np(nodes[1]);for(let j=0;j<3;j++){if(j===1)continue;const a=np(nodes[j]),m={x:(b.x+a.x)/2,y:Math.min(b.y,a.y)-r*2};draw(b,m,a,(t%1500)/1500,PAL.accent,1)}}}
function drawTimer(t,s){if(s<.25||s>=.5)return;const b=np(nodes[1]),r=Math.min(W,H)*.04,prog=clamp01((s-.25)/.25),bw=r*3,bh=r*.3,bx=b.x-bw/2,by=b.y-r*2;ctx.fillStyle=rgba(PAL.muted,.15);ctx.fillRect(bx,by,bw,bh);ctx.fillStyle=rgba(PAL.fail,.8);ctx.fillRect(bx,by,bw*prog,bh);ctx.strokeStyle=rgba(PAL.muted,.3);ctx.strokeRect(bx,by,bw,bh);ctx.fillStyle=rgba(PAL.fail,.9*beat(t,LOOP*.25,LOOP*.5));ctx.font=`500 ${Math.min(W,H)*.018}px system-ui`;ctx.textAlign='center';ctx.fillText('timeout',b.x,by-r*.4)}
function drawHud(t,s){const fs=Math.min(W,H)*.022,idx=Math.min(3,Math.floor(s*4)),labels=['Heartbeat','Timeout','Vote','Commit'],al=beat(t,idx*LOOP*.25,(idx+1)*LOOP*.25);ctx.fillStyle=rgba(PAL.text,.9*al);ctx.font=`700 ${fs*1.4}px system-ui`;ctx.textAlign='center';ctx.fillText(labels[idx],W*.5,H*.1);const bw=W*.3,bh=3,bx=W*.5-bw/2,by=H*.1+fs*.8;ctx.fillStyle=rgba(PAL.muted,.15);ctx.fillRect(bx,by,bw,bh);ctx.fillStyle=rgba(PAL.accent,.7);ctx.fillRect(bx,by,bw*(s*4%1),bh);
const roles=s<.25?['Leader','Follower','Follower']:s<.5?['Failed','Candidate','Follower']:s<.75?['Lost','Candidate','Voter']:['Follower','Leader','Follower'];const r=Math.min(W,H)*.04;nodes.forEach((n,i)=>{const p=np(n);ctx.fillStyle=rgba(PAL.muted,.7*al);ctx.font=`500 ${Math.min(W,H)*.016}px system-ui`;ctx.textAlign='center';ctx.fillText(roles[i],p.x,p.y+r+Math.min(W,H)*.065)});
ctx.fillStyle=rgba(PAL.muted,.5*al);ctx.font=`400 ${Math.min(W,H)*.014}px system-ui`;ctx.fillText('majority ≥ 2',W*.5,H*.92)}
function frame(now){if(__seek!=null)now=__seek;const t=now%LOOP,s=t/LOOP;ctx.clearRect(0,0,W,H);drawBg();drawConn();drawNodes(t,s);drawPackets(t,s);drawTimer(t,s);drawHud(t,s);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
