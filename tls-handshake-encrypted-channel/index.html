<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TLS Handshake</title>
<link rel="stylesheet" href="../css/brand.css" />
<link rel="stylesheet" href="../css/motion.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
canvas#stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById("stage");
var ctx=canvas.getContext("2d");
var LOOP=30000;
var PAL={accent:[62,207,142],fail:[239,68,68],text:[237,237,237],muted:[143,143,143],bg:[9,9,9]};
function rgba(c,a){return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
var W=0,H=0,dpr=1;
function resize(){
dpr=window.devicePixelRatio||1;
W=window.innerWidth;H=window.innerHeight;
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.width=W+"px";canvas.style.height=H+"px";
ctx.setTransform(dpr,0,0,dpr,0,0);
}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp01(v){return Math.max(0,Math.min(1,v));}
function easeInOut(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function quad(a,c,b,t){
var u=1-t;
return{x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};
}
var cPos,sPos,ctrl;
function buildLayout(){
cPos={x:W*0.2,y:H*0.5};
sPos={x:W*0.8,y:H*0.5};
ctrl={x:W*0.5,y:H*0.32};
}
function beatAlpha(t,start,end,fade){
if(fade===undefined)fade=1200;
if(t<start||t>=end)return 0;
if(t<start+fade)return easeInOut((t-start)/fade);
if(t>end-fade)return easeInOut((end-t)/fade);
return 1;
}
function drawBackground(t){
ctx.fillStyle=rgba(PAL.bg,1);
ctx.fillRect(0,0,W,H);
ctx.strokeStyle="rgba(255,255,255,0.03)";
ctx.lineWidth=1;
var sp=W/24;
var i;
for(i=0;i<=W;i+=sp){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
for(i=0;i<=H;i+=sp){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
}
function drawConnections(t){
var ca=1;
ctx.beginPath();
ctx.moveTo(cPos.x,cPos.y);
ctx.quadraticCurveTo(ctrl.x,ctrl.y,sPos.x,sPos.y);
ctx.strokeStyle=rgba(PAL.muted,0.12*ca);
ctx.lineWidth=1;
ctx.stroke();
var ta=beatAlpha(t,24000,29500,2000);
if(ta>0){
ctx.save();
ctx.beginPath();
ctx.moveTo(cPos.x,cPos.y);
ctx.quadraticCurveTo(ctrl.x,ctrl.y,sPos.x,sPos.y);
ctx.strokeStyle=rgba(PAL.accent,0.35*ta);
ctx.lineWidth=10;
ctx.shadowColor=rgba(PAL.accent,0.5);
ctx.shadowBlur=25;
ctx.stroke();
ctx.shadowBlur=0;
ctx.restore();
}
}
function drawNodes(t){
var pulse=1+Math.sin(t/400)*0.08;
var nr=Math.min(W,H)*0.035;
var na=1;
var g=ctx.createRadialGradient(cPos.x,cPos.y,0,cPos.x,cPos.y,nr*2.8*pulse);
g.addColorStop(0,rgba(PAL.accent,0.25*na));
g.addColorStop(1,rgba(PAL.accent,0));
ctx.fillStyle=g;
ctx.beginPath();ctx.arc(cPos.x,cPos.y,nr*2.8*pulse,0,Math.PI*2);ctx.fill();
ctx.fillStyle=rgba(PAL.accent,0.85*na);
ctx.beginPath();ctx.arc(cPos.x,cPos.y,nr*pulse,0,Math.PI*2);ctx.fill();
ctx.fillStyle=rgba(PAL.text,na);
ctx.font="600 "+Math.min(W,H)*0.024+"px system-ui,sans-serif";
ctx.textAlign="center";
ctx.fillText("Client",cPos.x,cPos.y+nr*2.2+Math.min(W,H)*0.02);
var sa=1;
var g2=ctx.createRadialGradient(sPos.x,sPos.y,0,sPos.x,sPos.y,nr*2.8*pulse);
g2.addColorStop(0,rgba(PAL.accent,0.25*sa));
g2.addColorStop(1,rgba(PAL.accent,0));
ctx.fillStyle=g2;
ctx.beginPath();ctx.arc(sPos.x,sPos.y,nr*2.8*pulse,0,Math.PI*2);ctx.fill();
ctx.fillStyle=rgba(PAL.accent,0.85*sa);
ctx.beginPath();ctx.arc(sPos.x,sPos.y,nr*pulse,0,Math.PI*2);ctx.fill();
ctx.fillStyle=rgba(PAL.text,sa);
ctx.font="600 "+Math.min(W,H)*0.024+"px system-ui,sans-serif";
ctx.textAlign="center";
ctx.fillText("Server",sPos.x,sPos.y+nr*2.2+Math.min(W,H)*0.02);
}
function drawPacket(t,startT,dur,from,to,ctrlPt,r,color,label){
var el=t-startT;
if(el<0||el>dur)return;
var p=easeInOut(el/dur);
var pos=quad(from,ctrlPt,to,p);
var i,tp,tpos,ta;
for(i=5;i>=1;i--){
tp=p-i*0.03;
if(tp<0)continue;
tpos=quad(from,ctrlPt,to,tp);
ta=(1-i/6)*0.35;
ctx.fillStyle=rgba(color,ta);
ctx.beginPath();ctx.arc(tpos.x,tpos.y,r*(1-i*0.1),0,Math.PI*2);ctx.fill();
}
ctx.save();
ctx.fillStyle=rgba(color,0.9);
ctx.shadowColor=rgba(color,0.6);
ctx.shadowBlur=12;
ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;
ctx.restore();
if(label){
var la=Math.min(1,p*4)*Math.min(1,(1-p)*4);
ctx.fillStyle=rgba(PAL.text,la*0.85);
ctx.font="500 "+Math.min(W,H)*0.017+"px system-ui,sans-serif";
ctx.textAlign="center";
ctx.fillText(label,pos.x,pos.y-r*2.8);
}
}
function drawEntities(t){
var pr=Math.min(W,H)*0.011;
drawPacket(t,4000,3500,cPos,sPos,ctrl,pr,PAL.accent,"Client Hello");
drawPacket(t,9000,3500,sPos,cPos,ctrl,pr,PAL.accent,"Server Hello");
drawPacket(t,11000,3000,sPos,cPos,ctrl,pr*0.75,PAL.muted,"Certificate");
drawPacket(t,14000,3000,cPos,sPos,ctrl,pr*0.9,PAL.accent,"Key Exchange");
drawPacket(t,15500,3000,sPos,cPos,ctrl,pr*0.9,PAL.accent,"Key Exchange");
drawPacket(t,19000,2500,cPos,sPos,ctrl,pr*0.7,PAL.accent,"Finished");
drawPacket(t,20500,2500,sPos,cPos,ctrl,pr*0.7,PAL.accent,"Finished");
var i;
for(i=0;i<3;i++){
drawPacket(t,24500+i*1300,2000,cPos,sPos,ctrl,pr*0.55,PAL.accent,null);
drawPacket(t,25200+i*1300,2000,sPos,cPos,ctrl,pr*0.55,PAL.accent,null);
}
}
function drawLock(t){
var la=beatAlpha(t,21000,29000,2000);
if(la<=0)return;
var cx=W*0.5,cy=H*0.32;
var sz=Math.min(W,H)*0.02;
var pulse=1+Math.sin(t/350)*0.06;
ctx.save();
ctx.globalAlpha=la;
ctx.strokeStyle=rgba(PAL.accent,0.9);
ctx.lineWidth=2.5;
ctx.shadowColor=rgba(PAL.accent,0.5);
ctx.shadowBlur=15;
ctx.beginPath();
ctx.arc(cx,cy-sz*0.4,sz*0.55*pulse,Math.PI,0);
ctx.stroke();
ctx.fillStyle=rgba(PAL.accent,0.85);
var bw=sz*1.1,bh=sz*0.85;
ctx.beginPath();
ctx.roundRect(cx-bw/2,cy-sz*0.1,bw,bh,3);
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle=rgba(PAL.bg,0.9);
ctx.beginPath();ctx.arc(cx,cy+bh*0.25,sz*0.15,0,Math.PI*2);ctx.fill();
ctx.restore();
}
function drawHud(t){
var ta=1;
ctx.fillStyle=rgba(PAL.text,ta);
ctx.font="700 "+Math.min(W,H)*0.038+"px system-ui,sans-serif";
ctx.textAlign="center";
ctx.fillText("TLS Handshake",W*0.5,H*0.1);
var steps=["Hello","Cert","Keys","Lock","Secure"];
var cs=0;
if(t>=4000&&t<9000)cs=0;
else if(t>=9000&&t<14000)cs=1;
else if(t>=14000&&t<19000)cs=2;
else if(t>=19000&&t<24000)cs=3;
else if(t>=24000)cs=4;
var sa=1;
var sw=Math.min(W,H)*0.09;
var sx=W*0.5-(steps.length-1)*sw/2;
var i,x,active,done;
for(i=0;i<steps.length;i++){
x=sx+i*sw;
active=i===cs;done=i<cs;
var dr=Math.min(W,H)*(active?0.007*(1+Math.sin(t/300)*0.25):0.004);
ctx.fillStyle=rgba(active||done?PAL.accent:PAL.muted,(active||done?0.8:0.25)*sa);
ctx.beginPath();ctx.arc(x,H*0.88,dr,0,Math.PI*2);ctx.fill();
ctx.fillStyle=rgba(active?PAL.text:PAL.muted,(active?0.9:0.45)*sa);
ctx.font="500 "+Math.min(W,H)*0.013+"px system-ui,sans-serif";
ctx.textAlign="center";
ctx.fillText(steps[i],x,H*0.88+Math.min(W,H)*0.024);
}
for(i=0;i<steps.length-1;i++){
var x1=sx+i*sw+Math.min(W,H)*0.008;
var x2=sx+(i+1)*sw-Math.min(W,H)*0.008;
var ld=i<cs;
ctx.strokeStyle=rgba(ld?PAL.accent:PAL.muted,(ld?0.4:0.12)*sa);
ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(x1,H*0.88);ctx.lineTo(x2,H*0.88);ctx.stroke();
}
var pa=1;
var bw2=W*0.3,bx=W*0.35,by=H*0.93,bh2=3;
ctx.fillStyle=rgba(PAL.muted,0.15*pa);
ctx.fillRect(bx,by,bw2,bh2);
var prog=clamp01(t/LOOP);
ctx.fillStyle=rgba(PAL.accent,0.6*pa);
ctx.fillRect(bx,by,bw2*prog,bh2);
}
var __seek=null;
window.__time=function(v){__seek=v;};
window.__loop=LOOP;
function frame(now){
if(__seek!==null)now=__seek;
var t=now%LOOP;
buildLayout();
ctx.clearRect(0,0,W,H);
drawBackground(t);
drawConnections(t);
drawNodes(t);
drawEntities(t);
drawLock(t);
drawHud(t);
requestAnimationFrame(frame);
}
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
